  {id:'toolong_block', name:'הודעה מעל 32KB — לא נשלחה', mode:'focus', html:()=>shell({stage:2,log:LOG.A,composer:{value:LONGPASTE,state:'block'}}), ann:()=>tv('chat.input.too_long_block'), d:'הודעה שחורגת מ-32KB (כ-16,000 תווים בעברית, נבדק בדפדפן לפני שליחה) לא נשלחה, ולכן גם לא עברה בדיקת דגלים. chat.input.too_long_block מוצגת **ליד שדה הקלט**, בתיבה צמודה מעליו ולא כבועה בתמליל. היא אומרת במפורש שההודעה לא נשלחה, מה לעשות, ומוסיפה 101. הטקסט **נשאר בשדה** כמו שהודבק, השדה במסגרת 2px בצבע שגיאה, וכפתור השליחה **נשאר פעיל** (לא מושבת). התיבה באה במקום רמז ה-800 והמונה. אין maxlength ואין חיתוך.', f:'התיבה היא אלמנט רגיל (לא אזור חי), והטקסט שלה מוכרז פעם אחת דרך המכריז. השדה aria-invalid עם aria-describedby על התיבה. המיקוד נשאר בשדה. סמל, טקסט ומסגרת, לא צבע בלבד.'},
  {id:'timeout', name:'תם הזמן', mode:'focus', html:()=>shell({stage:2,log:LOG.B+user(SU.u3)+sys(t('error.timeout'),`<button class="btn-sm" data-focus data-go="S3/waiting">${I('retry',16)} ${t('error.retry.button')}</button>`)}), d:'אחרי 25 שניות: הודעה מערכתית (מלבן אפור-בהיר עם סמל מידע, לא בועה של העוזר ולא אדום). הודעת הפונה נשמרת.', f:'המיקוד ל"לנסות שוב".'},
  {id:'offline', name:'אין חיבור', mode:'focus', html:()=>shell({stage:2,banner:`<div class="offline">${I('wifioff',18)}<span>${t('error.network')}</span></div>`,log:LOG.B+user(SU.u3,{unsent:true})}), ann:()=>tv('error.network'), d:'פס אפור-כהה מתחת לפס העליון (רגוע, לא אדום). הבועה האחרונה במסגרת מקווקוות + "לא נשלחה" + "לנסות שוב". ניסיון אוטומטי אחד כשהחיבור חוזר.', f:'מנגנון: הכרזה. הפס עצמו אינו אזור חי, והטקסט שלו מוכרז פעם אחת דרך המכריז. המיקוד לא זז.'},
  {id:'early', name:'יציאה מוקדמת', mode:'focus', html:()=>shell({stage:2,log:LOG.A+user('אני רוצה לדבר עם הדס')+bot(t('meta.want_human',{hadas_phone:PHONE}),{q:true}),quick:chips([chip(t('meta.want_human.to_form'),{solid:true,go:'S7/partial'}),chip(t('meta.want_human.stay'),{alt:true})])}), ann:()=>annBot('meta.want_human',true), d:'שני כפתורים, בלי שכנוע להישאר. "מעבר לטופס" מוביל לטופס במצב "תיק חלקי".', f:'כמו כפתורי בחירה.'},
  {id:'clinical', name:'שאלה קלינית', mode:'focus', html:()=>shell({stage:2,log:LOG.C}), d:'נוסח קבוע (meta.diagnosis_request) באותה בועה רגילה של העוזר — בלי עיצוב "אזהרה". בתור הבא — המטרה הבאה.', f:'—'},
  {id:'language', name:'שפה לא נתמכת', mode:'focus', html:()=>shell({stage:1,log:bot(t('goal.core_relation.ask'))+user('Hi, my son stutters. Can you help?')+bot(`<p>${tl('language.unsupported')[0]}</p><p lang="en" dir="ltr" style="text-align:left">${tl('language.unsupported')[1]}</p>`)}), d:'השורה באנגלית מסומנת lang="en" dir="ltr" בתוך הבועה, כדי שקורא מסך יחליף שפה.', f:'—'},
  {id:'expired', name:'פג תוקף באמצע', mode:'focus', html:()=>shell({stage:2,log:LOG.B+sys(t('error.session_expired'),`<button class="btn-sm" data-focus data-go="S1/default">${t('resume.restart')}</button>`),composer:false}), d:'רק אחרי התוקף המלא. שדה הקלט מוסר.', f:'המיקוד לכפתור.'},
  {id:'server', name:'תקלת שרת', mode:'focus', html:()=>shell({stage:2,log:LOG.B+user(SU.u3)+sys(t('error.generic'),`<button class="btn-sm" data-focus data-go="S10/midchat">${I('retry',16)} ${t('error.retry.button')}</button>`)}), d:'אחרי ניסיון חוזר אוטומטי אחד. כישלון שני → S10.', f:'המיקוד ל"לנסות שוב".'},
  {id:'a11y', name:'נגישות במצב מיקוד', mode:'focus', a11y:true, html:()=>shell({stage:1,log:bot(t('goal.core_relation.ask'),{q:true}),quick:relChips()}), d:'החלטה לנקודה 1 מה-UX: במצב מיקוד הכפתור הצף של AccessibilityWidget מוסתר (הוא היה יושב בדיוק על כפתור השליחה), ובפס העליון מופיע כפתור זהה במראה שפותח את אותו תפריט — כלפי מטה, מתחת לפס. נסו את הכפתורים בתפריט: הם מפעילים את הסימולציה על המסגרת.', f:'aria-expanded על הכפתור. Esc סוגר ומחזיר מיקוד לכפתור. המיקום: אחרי ה-✕ והכותרת, לפני ⋮.'},
  {id:'short1', name:'גובה קצר · שלב 1', mode:'focus', frame:{w:390,h:300}, html:()=>shell({stage:2,short:1,scroll:'top',log:LOG.A}), d:'גובה קצר (טלפון לאורך עם מקלדת פתוחה, או זום 400%): הרכיבים הקבועים לא יכולים לאכול את התמליל. הכלל הוא קריטריון ולא מספר: מה שנשאר לתמליל אחרי הרכיבים הקבועים חייב להספיק לשלוש שורות טקסט ולא להסתיר את מה שבמיקוד. שלב 1: מחוון השלבים עובר לזרימת הגלילה (גוללו בתוך המסגרת). הפס העליון וההסתייגות עדיין דביקים, והקלט הוא הרכיב הקבוע האחרון. גודל המסגרת כאן הוא המחשה בלבד: ספי הפיקסלים נקבעים אחרי מדידה במכשירים.', f:'מנגנון: אין הכרזה על המעבר. סדר ה-DOM וסדר המיקוד לא משתנים, רק מצב ההצמדה של הרכיב (דביק או בזרימה), בלי הרכבה מחדש, ולכן מיקוד וגלילה שורדים מעבר בין שלבים. מיקוד על רכיב שנגלל החוצה מחזיר אותו לתצוגה, מעל הקלט הדביק (scroll-padding).'},
  {id:'short2', name:'גובה קצר · שלב 2', mode:'focus', frame:{w:390,h:230}, html:()=>shell({stage:2,short:2,scroll:'top',log:LOG.A}), d:'שלב 2: גם הפס העליון עובר לזרימה. ✕, כפתור הנגישות ו-⋮ נשארים ראשונים בסדר המיקוד, ומיקוד עליהם מחזיר אותם לתצוגה. רק ההסתייגות והקלט נשארים דביקים.', f:'כמו שלב 1.'},
  {id:'short3', name:'גובה קצר · שלב 3 (זום 400%)', mode:'focus', frame:{w:320,h:180}, html:()=>shell({stage:2,short:3,scroll:'disc',log:LOG.A}), d:'שלב 3, כמו זום 400% במסך 1280×720 (כ-320×180). גם ההסתייגות עוברת לזרימה, והיא הפריט הראשון בתוך אזור התמליל: במלואה (chat.disclaimer_line, לא הנוסח הקצר) ובלי "עוד" (S12 נשאר ב-⋮, "על הכלי"). בתחילת שיחה היא בתוך המסך, וכל גלילה לראש מחזירה אותה. בכרטיס התוצאה ובדגל האדום ההסתייגות נמצאת בתוך הכרטיס (outcome.disclaimer, redflag.footer). הקלט הוא הרכיב הקבוע היחיד. ממתין לאישור משפטי (UX §3.0, §8): אם התשובה שלילית לא מחזירים פס קבוע, אלא סמל בשורת הקלט שפותח את "על הכלי".', f:'כמו שלב 1. ההסתייגות היא li ראשון ברשימת ההודעות, בלי תווית דובר (שורה של המערכת).'},
  {id:'short3_age', name:'גובה קצר · שלב 3, שאלת הגיל', mode:'focus', frame:{w:320,h:180}, html:()=>shell({stage:1,short:3,scroll:'bottom',log:bot(t('goal.core_relation.ask'))+user(tv('q.relation.opt.self'))+bot(t('goal.self_age_band.ask'),{q:true,anchor:true}),quick:chips([chip(t('q.self_age_band.opt.under_18'),{go:'S13/minor_pre'}),chip(t('q.self_age_band.opt.adult'),{demo:'age_adult'})],{grid:true})}), ann:()=>annBot('goal.self_age_band.ask',true), d:'שאלת הגיל בשלב 3: כפתורי הבחירה נמצאים בזרימה, מיד אחרי בועת השאלה (כך הם נשארים צמודים אליה), והקלט הוא הרכיב הקבוע היחיד. הגלילה לראש ההודעה. השאלה והכפתורים לא נכנסים בבת אחת. אחרי גלילה לראש ההודעה (כלל S3) הכפתורים נמצאים מתחת לקיפול, מאחורי הקלט הדביק. מיקוד Tab עליהם גולל אותם לתצוגה מעל הקלט (scroll-padding), והרמז שיש כפתורים נאמר בהכרזה וגם כטקסט מוסתר בסוף הבועה. כאן הגלילה היא לסוף.', f:'מנגנון: הכרזה (השאלה ואחריה a11y.buttons_hint), המיקוד נשאר בשדה הקלט. שם הקבוצה הוא השאלה.'}
 ]},
 {id:'S4', name:'שאלה נפוצה', states:[
  {id:'topics', name:'כפתורי נושא', mode:'focus', html:()=>shell({stage:1,log:bot(t('goal.core_relation.ask'))+user(tv('chat.quick.have_question'))+bot(t('faq.topic.prompt'),{q:true}),quick:chips(['faq.topic.price','faq.topic.location','faq.topic.kupot','faq.topic.online','faq.topic.hours'].map(id=>chip(t(id),{go:'S4/answer'})).concat([chip(t('faq.topic.other'),{alt:true})]))}), ann:()=>annBot('faq.topic.prompt',true), d:'"יש לי שאלה" פותח שורה קצרה של העוזר (faq.topic.prompt), שנותנת הקשר לקורא מסך ושומרת על תמליל קריא, ואז כפתורי נושא (מקומי, בלי שרת). "שאלה אחרת" מבקש להקליד.', f:'מנגנון: הכרזה, המיקוד נשאר בשדה. השורה מוכרזת כהודעה רגילה ואחריה a11y.buttons_hint. שם הקבוצה הוא השורה עצמה.'},
  {id:'answer', name:'יש מידע', mode:'focus', html:()=>shell({stage:2,log:LOG.A+user('כמה זה עולה?')+faqCard('faq.topic.price','price')+bot(t('faq.return')+' '+t('q.situations.child.n',{subject_ref:'יוסי'}))}), d:'כרטיס מידע = "הדף של הדס": מלבן ברוחב מלא (לא מיושר כבועה), מסגרת 1.5px כחול-אפור, סמל i בריבוע ושורת מקור. אחריו העוזר חוזר בעדינות לשאלה שחיכתה.', f:'מנגנון: הכרזה. הכרטיס הוא article עם תווית בתוך li, והנושא והטקסט שלו מוכרזים כהודעה, דרך המכריז. המיקוד לא זז.'},
  {id:'unknown', name:'אין מידע', mode:'focus', html:()=>shell({stage:2,log:LOG.A+user('אפשר להגיע ביום שישי?')+bot(t('faq.missing'))+bot(t('faq.return')+' '+t('q.situations.child.n',{subject_ref:'יוסי'}),{first:false})}), d:'אין מידע בדף העובדות: בועה רגילה של העוזר (לא כרטיס — זה לא מידע מהדס).', f:'—'},
  {id:'multiple', name:'כמה שאלות ברצף', mode:'focus', html:()=>shell({stage:2,log:LOG.A+user('כמה זה עולה, ואיפה הקליניקה?')+faqCard('faq.topic.price','price')+faqCard('faq.topic.location','location')+bot(t('faq.return')+' '+t('q.situations.child.n',{subject_ref:'יוסי'}))}), d:'כרטיס לכל שאלה, ואז חזרה אחת.', f:'—'}
 ]},
 {id:'S5', name:'תוצאות 1–4', states:[
  {id:'o1', name:'1 · כדאי לפנות', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(1),scroll:'anchor',composer:false}), d:'בועת הסיכום (מודל) היא בועה רגילה עם תווית "מה שעלה בשיחה". כרטיס התוצאה (נוסח קבוע) שונה בצורה ולא רק בצבע: מלבן ברוחב מלא, מסגרת 2px עם פס עליון 8px, סמל בריבוע, שורת תווית, כותרת גדולה, וההסתייגות בתחתית הכרטיס. שדה הקלט מוסר.', f:'מנגנון: מיקוד. המיקוד עובר פעם אחת לבועת הסיכום (tabindex=-1, עם תווית דובר מוסתרת), אחרי שהציור הסתיים. בלי הכרזה ובלי טיימר, והמכריז מרוקן. הכרטיס מיד אחרי הסיכום בסדר ה-DOM, וההמשך הוא סדר הקריאה הרגיל: כותרת h2, גוף, הסתייגות, פעולות. המחוון עובר ל"סיכום" בשקט. לבדיקה במכשיר: שהסיכום מוקרא כולו.'},
  {id:'o2', name:'2 · שווה התייעצות', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(2),scroll:'anchor',composer:false}), d:'אותו מבנה, טון כחול-אפור (hoki) וסמל שיחה: דלת פתוחה, בלי דחיפות. אותו כפתור.', f:'כמו 1.'},
  {id:'o3', name:'3 · לא עלו סימנים כעת — כבוי בהשקה (D-03)', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(3),scroll:'anchor',composer:false}), d:'כבוי בהשקה (D-03): המקרים האלה מקבלים תוצאה 2 בפועל, ונרשם would_be_outcome_3. המסך כאן נשאר מתוכנן, להפעלה עתידית. אין וי, אין ירוק, אין צבע הצלחה. טון ניטרלי (chatelle כהה), סמל "דף עם שורות", כותרת בשחור. "חשוב לדעת" בבלוק עם פס בצד ההתחלה, רשימת "מתי כן לפנות" עם עיגולים חלולים (לא וי), ו-101 כקישור. הכפתור באותה בולטות כמו ב-1–2, אחרי ההסתייגות המלאה והרשימה.', f:'כמו 1. הרשימה היא ul אמיתית.'},
  {id:'o4', name:'4 · לא בתחום', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(4),scroll:'anchor',composer:false}), d:'טון bali-hai וסמל שלט הכוונה. כל הפניה בכרטיס משנה עם קישור חיצוני מסומן. אין טופס; "נראה שמשהו לא הובן נכון?" צנוע עם טלפון.', f:'קישורים חיצוניים: target=_blank + טקסט מוסתר "נפתח בלשונית חדשה".'},
  {id:'fallback', name:'הסיכום החם נכשל', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(1,{fallback:true}),scroll:'anchor',composer:false}), d:'נוסח קבוע קצר במקום בועת הסיכום. הכרטיס לא תלוי במודל ותמיד מוצג.', f:'כמו 1, אבל אין סיכום: המיקוד לנוסח הקבוע שבא במקומו (outcome.summary.fallback). אם גם הוא חסר, לכותרת הכרטיס.'},
  {id:'noref', name:'4 · אין הפניה מתאימה', mode:'focus', html:()=>shell({stage:3,log:outcomeLog(4,{noref:true}),scroll:'anchor',composer:false}), d:'outcome.4.no_referral במקום הרשימה.', f:'כמו 1.'},
  {id:'reopened', name:'חזרה לשיחה ("שכחתי לספר")', mode:'focus', html:()=>shell({stage:3,log:LOG.D+user(SU.u5)+summaryBubble(false)+oc(2,{stale:true})+user(tv('outcome.add_more'))}), d:'המחוון נשאר ב"סיכום" ולא חוזר ל"השלמת פרטים" — זו שאלה אחת (wrap_up_ask), וחזרה אחורה הייתה נחווית כמו "מתחילים מחדש". הכרטיס הקודם נשאר בתמליל: מסגרת מקווקוות, בלי פס עליון ובלי כפתורים, ותגית "הכיוון הקודם, לפני העדכון". שדה הקלט חוזר. תוצאה חדשה תופיע ככרטיס חדש.', f:'המיקוד לשדה הקלט.'}
 ]},
 {id:'S6', name:'דגל אדום — דרגות ומסך משולב', states:[
  {id:'emergency', name:'emergency · חירום', mode:'rf', html:()=>rf('emergency'), d:'מחליף את כל המסך (אין תמליל, אין קלט, אין תפריט). בדסקטופ מחליף רק את לוח הכלי — כותרת האתר נשארת, בלי פוטר או קריאות לפעולה לצידו. רקע נייר בהיר, טקסט שחור, בלי אדום ובלי תנועה. סמל "השהיה" בעיגול — לא משולש אזהרה. הפעולה ראשונה בבלוק עם פס 8px. כפתור 101 בגובה 64, פחם (#282a2b) על רקע בהיר, 14.4:1 — הכי בולט במסך בלי להיות אזעקה. redflag.footer אחרי הפעולות, בגופן משני. אין טופס (D-04: emergency בלי טופס). מתחת לכפתור 101 שורת טקסט משנית (redflag.secondary.emergency) ולא כפתור: **אין כפתור חדר מיון בשום מקום** (הוחלט, ARCHITECTURE §20), כך שנשארת פעולה אחת בולטת.', f:'מנגנון אחד: מיקוד. המיקוד לכותרת (h1) אחרי הציור, כי שדה הקלט נמחק מה-DOM. אין role=alert, אין aria-live=assertive ואין הכרזה: הכותרת עומדת בפני עצמה, והפעולה ו-101 מיד אחריה. בכניסה למסך המכריז מרוקן, כדי ש"ההודעה בדרך…" לא תוקרא אחרי הכותרת. השם הנגיש של כפתור 101 הוא redflag.cta.call.a11y@v2 ("חיוג ל-101, מד"א"): הוא פותח בטקסט הגלוי (WCAG 2.5.3). קישור 101 עם data-track-ignore (UX §6.4). ברענון: אותו מיקוד, בלי הכרזה.'},
  {id:'urgent', name:'urgent · בירור רפואי בהקדם', mode:'rf', html:()=>rf('urgent'), d:'אותו מבנה בלי כפתור 101 ראשי; 101 כקישור בתוך הנוסח. **היחידה עם טופס משני** (D-04: form_after_message=secondary), מוצג רק באישור הדס, ורק כשזה הדגל היחיד: דגל נוסף שאוסר טופס מבטל אותו (ראו "משולב"). redflag.footer אחרי הפעולות.', f:'כמו emergency.'},
  {id:'urgent-noform', name:'urgent · בלי טופס (form: none)', mode:'rf', html:()=>rf('urgent-noform'), d:'אותו בלוק urgent, אבל הטופס חסום: הדס לא אישרה טופס משני (D-04), או שדגל אחר אוסר אותו. בלי redflag.after ובלי redflag.cta.form: שורת הסגירה היא redflag.after.no_form (הטלפון כטקסט, בלי משפט על טופס ובלי כפתור). השרת בוחר את המזהה לפי form במעטפה, והממשק מציג מה שקיבל.', f:'כמו emergency.'},
  {id:'hotline-distress', name:'hotline · מצוקה', mode:'rf', html:()=>rf('hotline-distress'), d:'דרגת hotline: ער"ן 1201 ככפתור הראשי, 101 משני. בלי טופס (D-04). redflag.footer אחרי הפעולות.', f:'כמו emergency.'},
  {id:'hotline-child', name:'hotline · בטיחות ילד — טיוטה', mode:'rf', html:()=>rf('hotline-child'), d:'גם זו דרגת hotline (D-04: בלי טופס), עם נוסח משלה (118/משרד הרווחה, 100 למשטרה). הנוסח עצמו עדיין טיוטה — ממתין לאישור עורך הדין על חובת דיווח, ולכן מסומן ככזה במסך. redflag.footer אחרי הפעולות בכל זאת, כי הוא קבוע ולא תלוי בניסוח.', f:'כמו emergency.'},
  {id:'combined', name:'משולב · בירור רפואי + בטיחות ילד', mode:'rf', html:()=>rf('combined'), d:'מסך אחד כשעלו שני דגלים (UX_SPEC S6, טיוטה 4), בין אם באותה הודעה ובין אם בתורות שונות. **בלוק ראשי** לדרגה הגבוהה (urgent: redflag.title.urgent והנוסח, 101 בתוך הנוסח), ומתחתיו **בלוק משני שלם** לדגל קו הסיוע הנוסף (בטיחות ילד): h2 משלו, הנוסח שלו והפעולה שלו. הבלוק המשני נבדל מהראשי בעוד מעבר לצבע: כותרת h2 קטנה (22 מול 28), מסגרת 1.5px עם פס 4px (מול 2px ו-8px), טקסט 17 מול 19, כפתור במתאר (52 מול 64 מלא) וקו דק מעליו. **אין טופס**: דגל בטיחות הילד אוסר אותו, ולכן בבלוק הראשי מוצג redflag.after.no_form במקום redflag.after ו-redflag.cta.form, גם אם urgent לבדו היה מציע אותו. כותרת הבלוק המשני: redflag.title.hotline.child_safety. redflag.footer פעם אחת בסוף, אחרי כל הבלוקים. אין חזרה לשיחה.', f:'מנגנון אחד: מיקוד, לכותרת הראשית (h1). אין role=alert ואין הכרזה בשום בלוק, והמשני נקרא ברצף אחריה. כל בלוק הוא section עם aria-labelledby על ה-h2 שלו, לניווט בכותרות. הכותרות המשניות לפי סוג הדגל, כך ששני h2 לא זהים.'},
  {id:'combined3', name:'משולב · חירום + מצוקה + בטיחות ילד (3 בלוקים)', mode:'rf', html:()=>rf('combined3'), d:'המקסימום: בלוק ראשי (חירום: כפתור 101 ושורת טקסט משנית) ושני בלוקים משניים, אחד לכל דגל קו סיוע נוסף (מצוקה עם ער"ן 1201 בכפתור במתאר, ובטיחות ילד). urgent לא מתווסף מתחת לחירום. הסתייגות אחת בסוף. **נסגר:** כל בלוק משני נושא כותרת לפי סוג הדגל (redflag.title.hotline.distress, redflag.title.hotline.child_safety), ולכן בניווט לפי כותרות אין שני h2 זהים. השורה הפסיבית על הדס (redflag.after.emergency) נשארת בבלוק הראשי בלבד (UX S6: שורה אחת על הדס בכל מסך).', f:'כמו "משולב": מיקוד ל-h1, בלי הכרזה.'}
 ]},
 {id:'S7', name:'טופס מסירה', states:[
  {id:'default', name:'רגיל', mode:'focus', html:()=>shell({stage:3,main:form('default'),composer:false}), d:'המשך טבעי של השיחה, באותו פס עליון. שם, טלפון (dir=ltr, מיושר לימין), שני שדות רשות כפתורים (ממתינים לאישור), הסכמה נפרדת. אין שדה הערות. "מה יישלח להדס" סגור כברירת מחדל.', f:'המיקוד לכותרת הטופס.'},
  {id:'preview', name:'תצוגה מקדימה פתוחה', mode:'focus', html:()=>shell({stage:3,main:form('preview'),composer:false}), d:'details/summary אמיתי. העובדות במילים של הפונה, וקישור "משהו לא מדויק? חזרה לשיחה".', f:'summary הוא כפתור מקלדת טבעי; aria-expanded מגיע מהדפדפן.'},
  {id:'partial', name:'תיק חלקי', mode:'focus', html:()=>shell({stage:2,main:form('partial'),composer:false}), d:'יציאה מוקדמת: שורת מידע מעל התצוגה המקדימה.', f:'—'},
  {id:'errors', name:'שגיאות שדה', mode:'focus', html:()=>shell({stage:3,main:form('errors'),composer:false}), d:'תקציר בראש הטופס עם קישורים לשדות, ושגיאה צמודה לכל שדה: סמל + טקסט + מסגרת 2px. לא רק צבע.', f:'מנגנון: מיקוד, לשדה השגוי הראשון. השגיאה מקושרת אליו ב-aria-describedby ולכן נקראת כחלק מהמיקוד. התקציר נשאר גלוי ואינו מוכרז (אין role=alert).'},
  {id:'sending', name:'שולח', mode:'focus', html:()=>shell({stage:3,main:form('sending'),composer:false}), ann:()=>tv('form.sending'), d:'פסי הקול בלבן בתוך הכפתור. לחיצה כפולה חסומה.', f:'מנגנון: הכרזה. "בשליחה…" מוכרז דרך המכריז, והמיקוד נשאר בכפתור.'},
  {id:'failed', name:'כשל', mode:'focus', html:()=>shell({stage:3,main:form('failed'),composer:false}), d:'הפרטים לא נמחקים. תיבת שגיאה עם "לנסות שוב".', f:'המיקוד לתיבת השגיאה.'},
  {id:'failed2', name:'כשל חוזר', mode:'focus', html:()=>shell({stage:3,main:form('failed2'),composer:false}), d:'בנוסף: וואטסאפ (טקסט כללי בלבד) וטלפון כשורות גדולות.', f:'—'}
 ]},
 {id:'S8', name:'אישור', states:[
  {id:'default', name:'רגיל', mode:'focus', html:()=>shell({stage:3,main:confirmScr('default'),composer:false}), d:'שקט ומדויק: מעטפה בעיגול ורוד-בהיר, בלי וי ירוק ובלי קונפטי. מה קורה עכשיו, מתי (משתנה מדף העובדות), מאיזה מספר, ושורת 101. **תוכן השיחה נמחק עם אישור המסירה — מהמכשיר ומהשרת (D-01, form.confirmation.privacy v2).** הפנייה עצמה (סיכום ופרטי קשר) נשארת אצל הדס. שורת הפרטיות נבחרת לפי תשובת השליחה: כאן delivered (form.confirmation.privacy v2), ושני האחרים בנפרד. שורת הגיבוי כוללת עכשיו קישור וואטסאפ (משתנה מדף העובדות).', f:'המיקוד לכותרת. ה-✕ כאן חוזר לאתר בלי דיאלוג (אין מה לאבד).'},
  {id:'other', name:'מבוגר אחר', mode:'focus', html:()=>shell({stage:3,main:confirmScr('other'),composer:false}), d:'שורה נוספת: הדס חוזרת לפונה, לא למושא.', f:'—'},
  {id:'afterflag', name:'אחרי דגל אדום', mode:'focus', html:()=>shell({stage:3,main:confirmScr('afterflag'),composer:false}), d:'וריאציית "בירור רפואי" בלבד: שורת הפעולה הרפואית חוזרת בבלוק הפחם לפני "מה קורה עכשיו".', f:'—'},
  {id:'privacy_pending', name:'מסירה ממתינה (delivery: pending)', mode:'focus', html:()=>shell({stage:3,main:confirmScr('privacy_pending'),composer:false}), d:'המייל לא נשלח בתוך הבקשה, והמערכת ממשיכה לנסות. הכותרת היא form.confirmation.title.pending ("בדרך", לא "נשלחו"), ו"מה קורה עכשיו" ו"מתי" הם הגרסאות .pending: "מתי" מעוגן להגעת הסיכום להדס ולא ללחיצה. שורת הגיבוי, המספר, ההסתייגות ו-add_later נשארים כמו שהם, ואין כפתור "בדיקת סטטוס". שורת הפרטיות היא form.confirmation.privacy.pending: הפרטים נשלחים, נשמרים במערכת עד שיגיעו, ובכל מקרה נמחקים תוך כשבוע. תוכן השיחה כבר נמחק.', f:'כמו "רגיל": מיקוד לכותרת, בלי הכרזה.'},
  {id:'both_pending', name:'מסירה ומחיקה ממתינות', mode:'focus', html:()=>shell({stage:3,main:confirmScr('both_pending'),composer:false}), d:'delivery: pending וגם content_deleted: false. אותה כותרת ואותם נוסחי .pending, ושורת הפרטיות היא form.confirmation.privacy.both_pending (תוכן השיחה יימחק תוך כשעה, והפרטים נשלחים ונמחקים תוך כשבוע).', f:'כמו "רגיל".'},
  {id:'privacy_delete', name:'מחיקה ממתינה (content_deleted: false)', mode:'focus', html:()=>shell({stage:3,main:confirmScr('privacy_delete'),composer:false}), d:'שורת הפרטיות היא form.confirmation.privacy.delete_pending: תוכן השיחה **יימחק** מהשרת תוך כשעה (לא "נמחק"). המסירה הצליחה, ולכן הכותרת נכונה והמסך זהה לרגיל חוץ מהשורה הזו.', f:'כמו "רגיל".'}
 ]},
 {id:'S9', name:'השיחה נמחקה', states:[
  {id:'default', name:'רגיל', mode:'focus', html:()=>shell({stage:3,main:s9Scr('default'),composer:false}), d:'אחרי "סיום ומחיקה" בתוצאה, "לצאת ולמחוק" בדיאלוג היציאה, "מחיקת השיחה" ב-S2, או "מחיקה" מהתפריט — כולם אותו DELETE מיידי בשרת (D-01). "למחוק עכשיו" כפעולה נפרדת בוטל: יש פעולה אחת. נשארת רק רשומת מדדים בלי תוכן.', f:'המיקוד לכותרת (chat.delete.done).'},
  {id:'outcome4', name:'אחרי תוצאה 4 (הכרטיס נשאר)', mode:'focus', html:()=>shell({stage:3,main:s9Scr('outcome4'),composer:false}), d:'כש"סיום ומחיקה" מגיע מתוצאה 4: כרטיס ההפניה (שם ודרכי קשר) נשאר על המסך — **בזיכרון הדף בלבד**, לא נשלף מהשרת שוב — עד שהפונה עוזב. שורת closed.keep_note מתחתיו מסבירה שזה חד-פעמי. בלי זה, המחיקה המיידית הייתה מוחקת לפונה בדיוק את ההפניה שבשבילה הגיע.', f:'כנ"ל. רענון מציג S1 רגיל — הכרטיס לא חוזר, וזו בדיוק המטרה.'},
  {id:'failed', name:'המחיקה נכשלה', mode:'focus', html:()=>shell({stage:3,main:s9Scr('failed'),composer:false}), d:'error.delete_failed: לא הצלחנו למחוק עכשיו — השיחה תימחק אוטומטית תוך 24 שעות בכל מקרה, ו"לנסות שוב".', f:'המיקוד לשגיאה.'}
 ]},
 {id:'S10', name:'תקלה ולא זמין', states:[
  {id:'unavailable', name:'לא זמין בפתיחה', mode:'page', html:()=>`<div class="intro">${fallbackScr('unavailable')}</div>`, d:'אחראי ולא מאשים: ענן חצוי בעיגול אפור, כותרת בשחור, שלוש דרכים כשורות גדולות (56px).', f:'המיקוד לכותרת.'},
  {id:'midchat', name:'תקלה באמצע', mode:'focus', html:()=>shell({stage:2,main:fallbackScr('midchat'),composer:false}), d:'כמו למעלה + "מה שסיפרת שמור" (רק אם נכון טכנית).', f:'המיקוד לכותרת.'},
  {id:'ratelimit', name:'הגבלת קצב', mode:'focus', html:()=>shell({stage:2,main:fallbackScr('ratelimit'),composer:false}), d:'error.rate_limit + "לנסות שוב".', f:'—'},
  {id:'nojs', name:'בלי JavaScript (וריאציה ד)', mode:'page', html:()=>`<div class="intro">${noJsScr()}</div>`, d:'JavaScript כבוי, חסום או שלא נטען. בלוק סטטי ב-HTML של העמוד עצמו (וגם <noscript>), שמוחלף כש-React עולה, כדי שכשל טעינה לא ייראה כדף לבן. אותו מחולל של system.unavailable, ולכן אותו טקסט: 101 (קישור tel:), הטלפון של הדס וקישור וואטסאפ (טקסט כללי בלבד). בלי טופס, בלי שיחה, בלי style="" (CSP): העיצוב מקובץ ה-CSS של הכלי. הכותרת והפוטר הסטטיים של הכלי נשארים.', f:'בלי סקריפט אין מיקוד מנוהל: הדף נטען עם המיקוד הטבעי בראשו. כל הפעולות הן <a> אמיתיים (tel: ו-wa.me).'},
  {id:'model_free', name:'בלי מודל (וריאציה ב)', mode:'focus', html:()=>shell({stage:2,log:LOG.B+user(SU.u3)+bot(t('system.model_free'))+bot(t('q.prev_treatment'),{first:false,q:true}),quick:chips([chip(t('q.prev_treatment.opt.yes')),chip(t('q.prev_treatment.opt.no')),chip(t('chat.quick.dont_know'),{alt:true})])}), ann:()=>tv('chat.sr.bot_label')+' '+tv('system.model_free')+' '+tv('q.prev_treatment')+' '+tv('a11y.buttons_hint'), d:'שיחה פתוחה שנשארה בלי מודל (3 כשלי מודל רצופים, השבתה, תקרת עלות 100% או תקציב כתובת). **זה לא מסך חדש אלא S3 עצמו, בלי באנר:** בלי הודעת מעבר, והפס העליון והמחוון לא משתנים. טקסט חופשי מקבל בועה רגילה של העוזר עם system.model_free (101), ואחריה המסך הבא בכפתורים, באותו מראה של שאלות סגורות. השדה נשאר. כשנגמרים המסכים: כרטיס תוצאה עם outcome.extraction_gap, בלי תוצאה 3, ואז הטופס כרגיל. המסך הבא כאן הוא דוגמה: אותה שאלה סגורה כמו ב"כפתורי בחירה" (אפשרויות התשובה שלה עדיין חסרות בקובץ).', f:'מנגנון: הכרזה. system.model_free מוכרזת כבועה רגילה דרך המכריז, ואחריה השאלה והרמז a11y.buttons_hint (הכפתורים לפני השדה). שם הקבוצה הוא השאלה. אין הכרזה נפרדת על המעבר.'}

/* =====================================================================
   FRAME BUILDERS
   ===================================================================== */
function statusbar(){return `<div class="m-status" aria-hidden="true"><span>21:40</span><span class="dots"><i></i></span></div>`;}
function mHeader(){return `<div class="m-header">${logo(40)}<button type="button" class="ham" aria-label="תפריט האתר">${I('menu',26,2)}</button></div>`;}
/* the tool page's own static header and footer (UX 4.3, COMPONENTS §3.23). The site's Header and Footer load their content through Firestore, which breaks
   D-06 (no third party on the tool page, connect-src 'self'). The pair is static and minimal: the logo and a visible "חזרה לאתר" link, no site navigation,
   no calls to action, every link a plain <a>. The header is neither sticky nor fixed (it scrolls with the page). */
function logoLink(h){return `<a href="#" data-noop class="logo-link" aria-label="${esc(tv('page.header.logo.a11y'))}" data-atid="page.header.logo.a11y">${logo(h)}</a>`;}
// the visible "חזרה לאתר" link. While a chat, a result or a form is open (S3 to S5, S7) the header and footer links open the existing exit dialog (S11),
// which returns focus to whatever opened it; elsewhere they are plain navigation. Either way they stay real <a href>.
function backLink(kind){
  const open = ['S3','S4','S5','S7'].includes(SCREENS[CUR.s].id);
  return `<a href="#" ${open?'data-go="S11/exit"':'data-noop'} class="${kind==='foot'?'back-foot':'back-site'}">${I('back',18)}${t('nav.back_to_site')}</a>`;
}
function toolHeaderM(){return `<div class="m-header tool-hd">${logoLink(40)}${backLink()}</div>`;}
function toolHeaderD(){return `<div class="d-header tool-hd">${logoLink(52)}${backLink()}</div>`;}
// footer: a second "חזרה לאתר" and the privacy policy (new tab, with the hidden hint, so it never leaves an open conversation). Nothing else.
// The accessibility statement joins it when there is one.
function toolFooter(){return `<footer class="tool-ft">${backLink('foot')}<a href="#" data-noop target="_blank" rel="noopener">${t('consent.privacy_link')} ${I('ext',16)}<span class="sr"> ${t('outcome.4.external_hint')}</span></a></footer>`;}
function dHeader(){return `<div class="d-header">${logo(52)}<nav class="d-nav" aria-label="ניווט האתר"><span>ראשי</span><span>קצת עליי</span><span>תחומי טיפול</span><span>מטופלים מספרים</span><span>בלוג מקצועי</span><span>טיפול אונליין</span><span>דברו איתי</span></nav></div>`;}
function fabs(wa=true){return `${wa?`<a href="#" data-noop class="fab-wa" aria-label="שלחו הודעה בוואטסאפ">${I('wa',32,1.6)}</a>`:''}<button type="button" class="fab-a11y" aria-label="תפריט נגישות" data-act="a11y">${I('a11y',28,2)}</button>`;}
function simCls(){return [OPT.hc?'sim-hc':'',OPT.noanim?'sim-noanim':'',OPT.size===1?'sim-tl':'',OPT.size===2?'sim-txl':'',OPT.links?'sim-links':'',OPT.font?'sim-rf':'',OPT.ids?'show-ids':'',OPT.focus?'show-focus':''].join(' ');}
function build(state){
  const html = state.html();
  const m = state.mode;
  if (state.frame){ // a bare viewport of the given size (short height / zoom), not a device: no status bar, no site chrome
    const {w,h} = state.frame;
    return `<div class="device m framed" style="width:${w+24}px"><div class="screen dev-mobile ${simCls()}" style="width:${w}px;height:${h}px;border-radius:12px">${html}</div></div>`;
  }
  if (OPT.dev==='m'){
    let body='';
    if (m==='page') body = state.site
      ? `${mHeader()}<div class="m-page"><div class="aur"></div><div class="page-scroll">${html}</div></div>${fabs(true)}${OPT.a11yOpen?a11yPanel('bottom'):''}`
      : `<div class="m-page nohdr"><div class="aur"></div><div class="page-scroll">${toolHeaderM()}${html}${toolFooter()}</div></div>${fabs(true)}${OPT.a11yOpen?a11yPanel('bottom'):''}`;
    else body = `<div class="m-focus">${html}</div>${OPT.a11yOpen?a11yPanel('top'):''}`;
    return `<div class="device m"><div class="screen dev-mobile ${simCls()}">${statusbar()}${body}</div></div>`;
  }
  let body='';
  // desktop: the tool page keeps its own header on every screen (not sticky, scrolls with the page) and its footer on every screen except S6
  const aur = '<div class="aur" style="position:fixed"></div>';
  if (m==='page') body = state.site
    ? `<div class="d-site">${dHeader()}<div class="d-main scroll">${aur}<div class="d-page">${html}</div></div>${fabs(false)}</div>`
    : `<div class="d-site"><div class="d-main scroll nohdr">${aur}${toolHeaderD()}<div class="d-page">${html}</div>${toolFooter()}</div>${fabs(false)}</div>`;
  else if (m==='focus') body = `<div class="d-site"><div class="d-main scroll nohdr">${aur}${toolHeaderD()}<div class="tool-panel">${html}</div>${toolFooter()}</div>${fabs(false)}</div>`;
  else if (m==='rf') body = `<div class="d-site"><div class="d-main scroll nohdr">${aur}${toolHeaderD()}<div class="tool-panel rf-panel">${html}</div></div>${fabs(false)}</div>`;
  else if (m==='mail') body = html;
  else body = html;
  if (OPT.a11yOpen && (m==='page'||m==='focus'||m==='rf')) body += a11yPanel('bottom');
  const url = m==='mail' ? 'mail.example · דואר נכנס' : m==='hpage' ? 'hadas-toda.co.il/…/feedback' : 'hadas-toda.co.il/שיחת-היכרות';
  return `<div class="device d"><div class="url">${url}</div><div class="screen dev-desktop ${simCls()}">${body}</div></div>`;
}

/* =====================================================================
   RENDER + NAV
   ===================================================================== */
const fitEl = document.getElementById('fit');
function stateAt(){return SCREENS[CUR.s].states[CUR.st];}
function render(pushHash=true){
  rebuildLogs();
  const sc = SCREENS[CUR.s], st = stateAt();
  if (st.a11y) OPT.a11yOpen = true;
  fitEl.innerHTML = build(st);
  // a field that opens with text in it (long message, 32KB paste) is grown like the live one: up to 4 lines
  fitEl.querySelectorAll('[data-composer]').forEach(ta=>{ if (ta.value){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; } });
  document.getElementById('view').classList.toggle('is-m', OPT.dev==='m');
  document.getElementById('crumb-t').textContent = `${sc.id} · ${sc.name}`;
  document.getElementById('crumb-s').textContent = `${st.name} · ${st.frame?`מסגרת ${st.frame.w}×${st.frame.h}`:OPT.dev==='m'?'מובייל':'דסקטופ'}`;
  // scroll positions inside frame
  fitEl.querySelectorAll('.log').forEach(l=>{
    const box = l.closest('.tool.short') || l;   // in the short-height mode the shell is what scrolls, not the transcript
    const how = l.dataset.scroll;
    if (how==='top') box.scrollTop = 0;
    else if (how==='disc'){ const d=l.querySelector('.flow-disc'); box.scrollTop = d ? d.offsetTop - 6 : 0; }
    else if (how==='anchor'){ const a=l.querySelector('#anchor'); box.scrollTop = a ? a.offsetTop - (box===l ? l.offsetTop : 0) - 8 : box.scrollHeight; }
    else box.scrollTop = box.scrollHeight;
  });
  // the announcer is emptied on every state change; states that say something do it through the announcer (after focus has settled when annDelay is set)
  const key = `${sc.id}/${st.id}/${OPT.dev}`;
  if (key !== lastKey){
    lastKey = key; announceClear();
    if (st.ann){ const say = ()=>announce(st.ann()); if (st.annDelay) annDelayT = setTimeout(say, st.annDelay); else say(); }
  }
  notes(sc, st);
  navSync();
  fit();
  if (pushHash) history.replaceState(null,'',`#${sc.id}/${st.id}/${OPT.dev}`);
}
function notes(sc, st){
  const ids = [...new Set([...fitEl.querySelectorAll('[data-tid],[data-atid]')].map(e=>e.dataset.tid||e.dataset.atid))];   // data-atid: an id used only as an attribute (an accessible name)
  const known = ids.filter(i=>!i.startsWith('דוגמת') && !i.startsWith('facts.'));
  const missingIds = known.filter(i=>{const base=i.split('#')[0].split('@')[0]; return isMissing(base);});
  const okIds = known.filter(i=>!missingIds.includes(i));
  const models = ids.filter(i=>i.startsWith('דוגמת'));
  document.getElementById('notes').innerHTML = `
   <h3>${esc(sc.id)} · ${esc(st.name)}</h3>
   <p><span class="lbl">מה רואים ולמה</span>${esc(st.d)}</p>
   <p><span class="lbl">מיקוד והקראה</span>${esc(st.f)}</p>
   <span class="lbl">מזהי טקסט במסך (${okIds.length} קיימים · ${missingIds.length} חסרים)</span>
   <ul class="ids">${okIds.map(i=>`<li>${esc(i)}</li>`).join('')}${missingIds.map(i=>`<li class="m" title="חסר בקובץ הנוסחים">${esc(i)}</li>`).join('')}</ul>
   ${models.length?`<p><span class="lbl">טקסט מודל לדוגמה</span>${models.map(esc).join(' · ')} — דוגמאות של תפקיד 3, לא נוסח קבוע.</p>`:''}
   <div class="legend"><span><span class="miss">[טקסט חסר: id]</span> חסר בקובץ הנוסחים</span><span><span class="screen" style="all:unset"><span class="var" style="font-family:ui-monospace,monospace;background:#eef0ff;color:#2f3a8f;border:1px solid #c7ccf5;border-radius:4px;padding:0 3px">{{var}}</span></span> משתנה</span><span>מסגרת מקווקוות במזהים = חסר</span></div>`;
}
function fit(){
  const dev = fitEl.querySelector('.device'); if(!dev) return;
  const W = dev.offsetWidth, H = dev.offsetHeight;
  const avail = fitEl.clientWidth;
  const s = Math.min(1, avail / W);
  dev.style.transform = `scale(${s})`;
  dev.style.left = Math.max(0,(avail - W*s)/2) + 'px';
  fitEl.style.height = Math.ceil(H*s) + 'px';
}
function go(screenId, stateId){
  const si = SCREENS.findIndex(x=>x.id===screenId); if (si<0) return;
  const sti = Math.max(0, SCREENS[si].states.findIndex(x=>x.id===stateId));
  CUR = {s:si, st:sti}; OPT.a11yOpen = false; render();
}
function step(d){
  const flat = []; SCREENS.forEach((s,i)=>s.states.forEach((x,j)=>flat.push([i,j])));
  let k = flat.findIndex(([i,j])=>i===CUR.s&&j===CUR.st); k = (k+d+flat.length)%flat.length;
  CUR = {s:flat[k][0], st:flat[k][1]}; OPT.a11yOpen=false; render();
}
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = `<h2>מלאי המסכים (UX_SPEC §3)</h2>` + SCREENS.map((s,i)=>`<div class="nav-grp"><button type="button" class="nav-scr" data-nav="${i}:0"><span class="code">${s.id}</span>${esc(s.name)}</button><ul class="nav-states">${s.states.map((x,j)=>`<li><button type="button" data-nav="${i}:${j}">${esc(x.name)}</button></li>`).join('')}</ul></div>`).join('');
  const sel = document.getElementById('sel-screen');
  sel.innerHTML = SCREENS.map((s,i)=>`<option value="${i}">${s.id} · ${esc(s.name)}</option>`).join('');
}
function navSync(){
  document.querySelectorAll('.nav-states button').forEach(b=>{const [i,j]=b.dataset.nav.split(':').map(Number); b.setAttribute('aria-current', String(i===CUR.s&&j===CUR.st));});
  document.getElementById('sel-screen').value = CUR.s;
  const ss = document.getElementById('sel-state');
  ss.innerHTML = SCREENS[CUR.s].states.map((x,j)=>`<option value="${j}">${esc(x.name)}</option>`).join('');
  ss.value = CUR.st;
  document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.dev===OPT.dev)));
  document.getElementById('opt-hc').checked = OPT.hc; document.getElementById('opt-anim').checked = OPT.noanim; document.getElementById('opt-size').value = OPT.size;
}

/* ---- the ONE announcer (COMPONENTS §7.1) ---- */
const ANN = document.getElementById('sr-announcer'), ANN_VIS = document.getElementById('ann-vis');
let annT = 0, annDelayT = 0, lastKey = '';
function plain(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent.replace(/\s+/g,' ').trim(); }
function announceClear(){ clearTimeout(annT); clearTimeout(annDelayT); ANN.textContent=''; ANN_VIS.textContent='—'; }
function announce(text){ // emptied first, so that an identical message is announced again; then the text is written
  clearTimeout(annT); ANN.textContent=''; ANN_VIS.textContent=text;
  annT = setTimeout(()=>{ ANN.textContent = text; }, 60);
}
// a new assistant message as the announcer gets it: speaker label, the whole message, and (when it has quick replies) the hint
const annBot = (id, hint=false)=> tv('chat.sr.bot_label')+' '+tv(id)+(hint?' '+tv('a11y.buttons_hint'):'');

/* ---- live demo inside S3/opening ---- */
const DEMO_REPLIES = ['q.onset.child.n','q.impact.child.n','q.prev_treatment','q.anything_else'];
let demoK = 0;
function demoReply(log, html, then, withChips=false){
  const list = log.querySelector('.msgs');
  const reduce = OPT.noanim || matchMedia('(prefers-reduced-motion: reduce)').matches;
  // the buttons that were there are gone, so the hint and the group-naming id of the old question go too
  list.querySelectorAll('.q-hint').forEach(e=>e.remove()); list.querySelectorAll('#q-cur').forEach(e=>e.removeAttribute('id'));
  const tw = document.createElement('div'); tw.innerHTML = typing(); const node = tw.firstElementChild; list.appendChild(node); log.scrollTop = log.scrollHeight;
  announce(tv('chat.typing'));   // once, through the announcer; the typing bubble itself is not a live region
  const send = fitEl.querySelector('[data-send]'); if (send) send.setAttribute('aria-disabled','true');
  setTimeout(()=>{ node.remove(); const w=document.createElement('div'); w.innerHTML = bot(html,{q:withChips}); list.appendChild(w.firstElementChild); log.scrollTop = log.scrollHeight;
    announce(tv('chat.sr.bot_label')+' '+plain(html)+(withChips?' '+tv('a11y.buttons_hint'):''));   // whole, once; focus stays in the input
    then && then(); const ta=fitEl.querySelector('[data-composer]'); if (send) send.setAttribute('aria-disabled', ta && ta.value.trim()?'false':'true'); }, reduce?600:1300);
}
function demoChip(btn){
  const log = fitEl.querySelector('.log'); if(!log) return;
  const rel = btn.dataset.demo; const label = btn.textContent.trim();
  const qc = fitEl.querySelector('.chips'); if (qc) qc.remove();
  const u = document.createElement('div'); u.innerHTML = user(label); log.querySelector('.msgs').appendChild(u.firstElementChild);
  const q = rel==='age_adult'?t('goal.core_onset_pattern.ask'):rel==='son'?t('q.age.child.m',{subject_ref:'הבן שלך'}):rel==='daughter'?t('q.age.child.f',{subject_ref:'הבת שלך'}):rel==='self'?t('q.age.self'):t('q.relation.other_followup');
  demoReply(log, q, ()=>{ const tool = fitEl.querySelector('.tool'); const cw = tool.querySelector('.composer-wrap'); const c = document.createElement('div'); c.innerHTML = chips([chip(t('chat.quick.dont_know'),{alt:true,demo:'dk'})]); tool.insertBefore(c.firstElementChild, cw); }, true);
}
function demoSend(){
  const ta = fitEl.querySelector('[data-composer]'); const log = fitEl.querySelector('.log'); const send = fitEl.querySelector('[data-send]');
  if (!ta || !log || !send) return;
  if (send.getAttribute('aria-disabled')==='true'){ if(!fitEl.querySelector('.c-hint')){ const h=document.createElement('div'); h.className='c-hint'; h.innerHTML=`${I('clock',15)} ${t('chat.send.wait')}`; ta.closest('.composer-wrap').prepend(h); announce(tv('chat.send.wait')); setTimeout(()=>h.remove(),2500);} return; }
  const v = ta.value.trim(); if (!v) return;
  const qc = fitEl.querySelector('.chips'); if (qc) qc.remove();
  const u = document.createElement('div'); u.innerHTML = user(v); log.querySelector('.msgs').appendChild(u.firstElementChild);
  ta.value=''; ta.style.height=''; log.scrollTop = log.scrollHeight;
  demoReply(log, t(DEMO_REPLIES[demoK++ % DEMO_REPLIES.length]));
}

function copyContact(btn){
  // success: plain visible text + one announcement; failure: the failure text + the details as selectable text. Focus stays on the button either way.
  const done = ok=>{
    const row = btn.closest('.copy-row'), card = btn.closest('.rcard');
    row.querySelectorAll('.copied-note').forEach(e=>e.remove()); card.querySelectorAll('.copy-failed,.payload').forEach(e=>e.remove());
    if (ok){ row.insertAdjacentHTML('beforeend', `<span class="copied-note">${I('check',16)} ${t('reporter.copied')}</span>`); announce(tv('reporter.copied')); }
    else { row.insertAdjacentHTML('afterend', copyFailHtml()); announce(tv('reporter.copy_failed')); }
    btn.focus();
  };
  try { navigator.clipboard.writeText(copyPayloadText()).then(()=>done(true), ()=>done(false)); } catch(e){ done(false); }
}

/* ---- events ---- */
document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if (nav){ const [i,j]=nav.dataset.nav.split(':').map(Number); CUR={s:i,st:j}; OPT.a11yOpen=false; render(); return; }
  if (e.target.closest('[data-noop]')) e.preventDefault();
  const demo = e.target.closest('[data-demo]');
  if (demo && fitEl.contains(demo)){ if (demo.dataset.demo==='dk'){ const ta=fitEl.querySelector('[data-composer]'); ta.value=tv('chat.quick.dont_know'); const s=fitEl.querySelector('[data-send]'); s.setAttribute('aria-disabled','false'); demoSend(); } else demoChip(demo); return; }
  const act = e.target.closest('[data-act]');
  if (act && fitEl.contains(act)){
    const a = act.dataset.act;
    if (a==='a11y'){ OPT.a11yOpen=!OPT.a11yOpen; const keep=OPT.a11yOpen; render(false); OPT.a11yOpen=keep; return; }
    if (a==='sim-hc'){ OPT.hc=!OPT.hc; } else if (a==='sim-anim'){ OPT.noanim=!OPT.noanim; } else if (a==='sim-size'){ OPT.size=(OPT.size+1)%3; } else if (a==='sim-links'){ OPT.links=!OPT.links; } else if (a==='sim-font'){ OPT.font=!OPT.font; } else if (a==='sim-reset'){ OPT.hc=false;OPT.noanim=false;OPT.size=0;OPT.links=false;OPT.font=false; }
    if (a.startsWith('sim-')){ const keep=OPT.a11yOpen; render(false); OPT.a11yOpen=keep; if(keep){ fitEl.innerHTML = build(stateAt()); fit(); } return; }
    if (a==='consent'){ const cb = fitEl.querySelector('#consent-cb'); if (cb && cb.checked){ go('S1','loading'); setTimeout(()=>go('S3','opening'), 900); } else go('S1','missing'); return; }
    if (a==='tobottom'){ const l=fitEl.querySelector('.log'); l.scrollTop=l.scrollHeight; act.remove(); return; }
    if (a==='copy-contact'){ copyContact(act); return; }
  }
  const g = e.target.closest('[data-go]');
  if (g && fitEl.contains(g)){ e.preventDefault(); const [s,st]=g.dataset.go.split('/'); go(s,st); return; }
  if (e.target.closest('[data-send]') && fitEl.contains(e.target)) { demoSend(); return; }
  const seg = e.target.closest('.segopt');
  if (seg && fitEl.contains(seg)){ seg.parentElement.querySelectorAll('.segopt').forEach(b=>b.setAttribute('aria-checked','false')); seg.setAttribute('aria-checked','true'); }
});
document.addEventListener('input', e=>{
  if (e.target.matches('[data-composer]')){
    const ta = e.target; ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px';
    const s = fitEl.querySelector('[data-send]'); if (s && !fitEl.querySelector('.typing')) s.setAttribute('aria-disabled', ta.value.trim()?'false':'true');
  }
});
document.addEventListener('keydown', e=>{
  if (e.target.matches('[data-composer]') && e.key==='Enter' && !e.shiftKey && OPT.dev==='d'){ e.preventDefault(); demoSend(); return; }
  if (e.key==='Escape' && OPT.a11yOpen){ OPT.a11yOpen=false; render(false); return; }
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (!inField && (e.key==='ArrowLeft'||e.key==='ArrowRight') && !fitEl.contains(e.target)){ step(e.key==='ArrowLeft'?1:-1); }
});
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('sel-screen').onchange=e=>{CUR={s:+e.target.value,st:0};OPT.a11yOpen=false;render();};
document.getElementById('sel-state').onchange=e=>{CUR.st=+e.target.value;OPT.a11yOpen=false;render();};
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{OPT.dev=b.dataset.dev;OPT.a11yOpen=false;render();});
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>{const v=b.dataset.themeBtn; if(v==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
document.getElementById('opt-work').onchange=e=>{OPT.working=e.target.checked;render(false);};
document.getElementById('opt-ids').onchange=e=>{OPT.ids=e.target.checked;render(false);};
document.getElementById('opt-focus').onchange=e=>{OPT.focus=e.target.checked;render(false);};
document.getElementById('opt-hc').onchange=e=>{OPT.hc=e.target.checked;render(false);};
document.getElementById('opt-anim').onchange=e=>{OPT.noanim=e.target.checked;render(false);};
document.getElementById('opt-size').onchange=e=>{OPT.size=+e.target.value;render(false);};
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(fitEl);
document.fonts && document.fonts.ready.then(fit);

/* ---- init from hash: #S3/waiting/m (also reacts to hash changes, for links between roles) ---- */
buildNav();
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1)).split('/');
  if (h[2]==='d'||h[2]==='m') OPT.dev = h[2];
  const si = SCREENS.findIndex(x=>x.id===h[0]);
  if (si>=0){ CUR.s=si; const sti=SCREENS[si].states.findIndex(x=>x.id===h[1]); CUR.st=Math.max(0,sti); }
  OPT.a11yOpen = false;
  render(false);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
