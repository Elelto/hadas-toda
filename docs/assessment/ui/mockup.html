<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקאפ שיחת היכרות</title>
<meta name="description" content="מוקאפ אינטראקטיבי של שיחת ההיכרות עם העוזר הדיגיטלי של הדס תודה: כל המסכים והמצבים, מובייל ודסקטופ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. CHROME (the mockup's own UI) — tokens on :root, supports dark mode
   ===================================================================== */
:root{
  --c-bg:#f6f4f8; --c-surface:#ffffff; --c-surface-2:#f1eef4; --c-text:#1d1a21;
  --c-muted:#5b5563; --c-border:#ddd6e3; --c-accent:#a73764; --c-on-accent:#ffffff;
  --c-bezel:#1d1b20; --c-focus:#a73764; --c-shadow:0 10px 30px rgba(40,30,50,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#161419; --c-surface:#221f26; --c-surface-2:#2c2831; --c-text:#f2eef5;
    --c-muted:#b9b1c1; --c-border:#3a3540; --c-accent:#e4becb; --c-on-accent:#1a1a1a;
    --c-bezel:#0b0a0d; --c-focus:#e4becb; --c-shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#161419; --c-surface:#221f26; --c-surface-2:#2c2831; --c-text:#f2eef5;
  --c-muted:#b9b1c1; --c-border:#3a3540; --c-accent:#e4becb; --c-on-accent:#1a1a1a;
  --c-bezel:#0b0a0d; --c-focus:#e4becb; --c-shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--c-bg);color:var(--c-text);font-family:Rubik,Heebo,system-ui,sans-serif;font-size:15px;line-height:1.5;overflow-x:clip;max-width:100vw}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ch-head{padding:16px 16px 12px;border-bottom:1px solid var(--c-border);background:var(--c-surface)}
.ch-head-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.ch-title h1{margin:0;font-size:22px;font-weight:600;line-height:1.25}
.ch-title p{margin:4px 0 0;color:var(--c-muted);font-size:14px;max-width:62ch}
.ch-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--c-border);border-radius:10px;overflow:hidden;background:var(--c-surface-2)}
.seg button{border:0;background:transparent;color:var(--c-text);font:inherit;font-size:14px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent);font-weight:600}
.seg-label{font-size:13px;color:var(--c-muted);margin-inline-end:6px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:40px}
.tog input{width:18px;height:18px;accent-color:var(--c-accent)}
.ch-sel{font:inherit;font-size:14px;color:var(--c-text);background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
.ch-main{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:16px;padding:16px}
@media (min-width:1000px){.ch-main{grid-template-columns:290px minmax(0,1fr)}}
.ch-nav{display:none;background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:10px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (min-width:1000px){.ch-nav{display:block}}
.ch-nav h2{font-size:13px;color:var(--c-muted);font-weight:500;margin:6px 8px 8px}
.nav-grp{margin-bottom:6px}
.nav-scr{display:block;width:100%;text-align:start;border:0;background:transparent;color:var(--c-text);font:inherit;font-weight:600;font-size:14px;padding:8px;border-radius:8px;cursor:pointer}
.nav-scr .code{display:inline-block;min-width:34px;color:var(--c-accent);font-variant-numeric:tabular-nums}
.nav-states{list-style:none;margin:0 0 4px;padding:0 0 0 0;padding-inline-start:34px;display:flex;flex-wrap:wrap;gap:4px}
.nav-states button{border:1px solid var(--c-border);background:var(--c-surface-2);color:var(--c-text);font:inherit;font-size:12.5px;padding:3px 8px;border-radius:999px;cursor:pointer;min-height:28px}
.nav-states button[aria-current="true"]{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent);font-weight:600}
.ch-mnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (min-width:1000px){.ch-mnav .ch-sel{display:none}}
.ch-btn{font:inherit;font-size:14px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.ch-crumb{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:6px 0 10px}
.ch-crumb b{font-size:18px}
.ch-crumb span{color:var(--c-muted);font-size:14px}
.ch-view{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.ch-view.is-m{grid-template-columns:minmax(0,440px) minmax(0,1fr)}}
.fit{position:relative;width:100%;overflow:hidden}
.fit > .device{position:absolute;top:0;left:0;transform-origin:top left}
.ch-notes{background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:14px 16px;font-size:14px}
.ch-notes h3{margin:0 0 6px;font-size:15px}
.ch-notes p{margin:0 0 10px}
.ch-notes .lbl{display:block;font-size:12.5px;color:var(--c-muted);font-weight:600;margin-bottom:2px}
.ids{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px;padding:0;list-style:none}
.ids li{font-family:ui-monospace,Consolas,monospace;font-size:12px;direction:ltr;padding:2px 6px;border-radius:6px;background:var(--c-surface-2);border:1px solid var(--c-border)}
.ids li.m{border-style:dashed;border-color:#b38600;color:var(--c-text)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--c-muted);margin-top:10px}
.legend .miss,.legend .var{font-size:12px}
.device.m{width:414px;padding:12px;border-radius:48px;background:var(--c-bezel);box-shadow:var(--c-shadow)}
.device.d{width:1280px;border-radius:12px;background:var(--c-bezel);padding:30px 0 0;box-shadow:var(--c-shadow)}
.device.d::before{content:"";position:absolute;top:11px;right:16px;width:46px;height:9px;background:radial-gradient(circle,#ff6159 3.5px,transparent 4px) 0 0/16px 9px repeat-x;opacity:.9}
.device.d .url{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:420px;height:20px;border-radius:6px;background:#2f2c33;color:#c9c2d0;font:12px/20px Rubik,sans-serif;text-align:center;direction:ltr}

/* =====================================================================
   2. IN-FRAME: the site's own light design (does NOT follow dark mode)
   ===================================================================== */
.screen{
  /* site tokens — src/styles/global.css */
  --mischka:#e9e6ec; --bouquet:#b97ba0; --hoki:#658ba4; --night-shadz:#a73764; --lavender-gray:#cbb9d6;
  --cadillac:#ac4c74; --chatelle:#bab3c6; --bali-hai:#87a0b7; --melanie:#e4becb; --blush:#b44470;
  --primary:var(--bouquet); --primary-dark:var(--night-shadz); --primary-light:var(--melanie);
  --secondary:var(--hoki); --secondary-dark:#282a2b; --accent:var(--cadillac); --light:var(--mischka);
  --light-hover:#f4f2f7; --dark:#1a1a1a; --dark-light:#4a4a4a; --border:var(--lavender-gray); --error:#e63946;
  /* derived values (prefix it- = intake tool). Every one is listed in COMPONENTS.md §1.2 */
  --it-user-bg:#f3e2e8; --it-badge-bg:#f7eff4; --it-field-bg:#fbf9fc; --it-field-border:#8d8896;
  --it-bot-bg:rgba(255,255,255,.88); --it-bot-border:rgba(203,185,214,.55);
  --it-faq-bg:#f0f3f6; --it-hoki-ink:#4c687b; --it-o3-ink:#6c6873; --it-bali-ink:#586877; --it-o4-bg:#f1f4f6;
  --it-error-ink:#b82e38; --it-plum-deep:#862c50; --it-placeholder:#6b6570; --it-hair:#e3dee8;
  --it-btn-grad:linear-gradient(135deg,var(--cadillac),var(--night-shadz));
  --it-ring:0 0 0 4px rgba(167,55,100,.16);
  --it-aurora:linear-gradient(135deg,#fffbfd 0%,#fcf7fa 100%);
  --it-glass-shadow:0 8px 32px rgba(31,38,135,.10);
  --wa-green:#25d366; --wa-dark:#128c7e;
  /* type scale — multiplied by --u so the site's "text size" setting scales the tool as a whole */
  --u:1px;
  --t12:calc(var(--u)*12.5); --t13:calc(var(--u)*13); --t14:calc(var(--u)*14); --t15:calc(var(--u)*15); --t16:calc(var(--u)*16);
  --t17:calc(var(--u)*17); --t19:calc(var(--u)*19); --t22:calc(var(--u)*22); --t26:calc(var(--u)*26); --t28:calc(var(--u)*28); --t34:calc(var(--u)*34);
  --tb:var(--t16);
  position:relative;overflow:hidden;color:var(--dark);font-family:Rubik,Heebo,sans-serif;font-size:var(--t16);line-height:1.6;
  background:#fff;color-scheme:light;direction:rtl;letter-spacing:.2px;-webkit-font-smoothing:antialiased;
}
.screen.sim-tl{--u:1.1px}
.screen.sim-txl{--u:1.25px}
.screen.sim-rf, .screen.sim-rf *{font-family:Arial,Helvetica,sans-serif!important}
.screen.sim-links a{text-decoration:underline!important;background-color:yellow!important;color:#000!important}
.dev-mobile.screen{width:390px;height:800px;border-radius:36px}
.dev-desktop.screen{width:1280px;height:800px;border-radius:0 0 12px 12px;--tb:var(--t17)}
.screen *{box-sizing:border-box}
.screen p{margin:0}
.screen h1,.screen h2,.screen h3{font-family:Rubik,sans-serif;margin:0;letter-spacing:-.02em}
.screen button{font-family:inherit}
.screen :focus-visible{outline:3px solid var(--night-shadz);outline-offset:2px}
.screen a{color:var(--cadillac);font-weight:500;text-decoration:none}
.screen a:hover{color:var(--night-shadz);text-decoration:underline}
.screen a[dir="ltr"]{unicode-bidi:isolate;white-space:nowrap} /* a phone number inside a line of text never breaks across lines */
.screen .ic{flex:none;display:inline-block;vertical-align:middle}
.screen .var{font-family:ui-monospace,Consolas,monospace;font-size:.86em;background:#eef0ff;color:#2f3a8f;border:1px solid #c7ccf5;border-radius:4px;padding:0 3px;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.miss{background:#fff4d6;color:#6b4e00;border:1px dashed #b38600;border-radius:4px;padding:0 4px;overflow-wrap:anywhere;font-weight:500;font-size:.86em;line-height:1.35}
.miss.work{background:transparent;color:inherit;border:0;border-bottom:2px dashed #b38600;border-radius:0;padding:0;font-weight:inherit}
.show-ids .tx[data-tid]{outline:1px dashed #6d4fd8;outline-offset:1px}
.show-ids .tx[data-tid]::after{content:attr(data-tid);display:inline-block;font:600 10px/1.3 ui-monospace,Consolas,monospace;background:#3b2a6b;color:#fff;padding:1px 4px;border-radius:4px;margin-inline-start:4px;vertical-align:middle;direction:ltr;letter-spacing:0;white-space:nowrap}

/* ---------- device scaffolding ---------- */
.m-status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 13px/1 Rubik,sans-serif;color:#1a1a1a;background:#fff;position:relative;z-index:3}
.m-status .dots{display:flex;gap:4px;align-items:center}
.m-status .dots i{display:block;width:16px;height:9px;border:1.5px solid #1a1a1a;border-radius:3px}
.m-focus{position:absolute;top:28px;bottom:0;left:0;right:0;display:flex;flex-direction:column;background:var(--it-aurora)}
.m-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px;background:#fff;border-bottom:1px solid rgba(101,139,164,.15);position:relative;z-index:2}
.m-page{position:absolute;top:92px;bottom:0;left:0;right:0;overflow:hidden}
.page-scroll{position:absolute;inset:0;overflow:auto}
.aur{position:absolute;inset:0;background:var(--it-aurora);overflow:hidden;pointer-events:none}
.aur::before,.aur::after{content:"";position:absolute;border-radius:60% 40% 30% 70%/60% 30% 70% 40%;filter:blur(40px)}
.aur::before{top:-12%;left:-20%;width:80%;aspect-ratio:1;background:radial-gradient(circle,rgba(233,230,236,.95),transparent 70%)}
.aur::after{bottom:-18%;right:-22%;width:75%;aspect-ratio:1;background:radial-gradient(circle,rgba(215,198,225,.6),transparent 70%)}
.ham{width:44px;height:44px;border:0;background:transparent;color:var(--bouquet);display:grid;place-items:center;border-radius:10px}
.logo{display:inline-flex;align-items:center;gap:6px;direction:rtl}
.logo-t{display:flex;flex-direction:column;line-height:1.1}
.logo-t b{font-weight:600;color:var(--hoki);font-size:calc(var(--h)*.42)}
.logo-t small{color:#7a7a85;font-size:calc(var(--h)*.24)}
.fab-wa{position:absolute;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--wa-green);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5;border:0}
.fab-a11y{position:absolute;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--bouquet);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2);z-index:6;border:0;cursor:pointer}
.d-site{position:absolute;inset:0;background:#fff}
.d-header{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:#fff;border-bottom:1px solid rgba(101,139,164,.15);position:relative;z-index:2}
.d-nav{display:flex;gap:30px;font-size:15px;color:#1a1a1a}
.d-nav span{padding:6px 0}
.d-main{position:absolute;top:88px;bottom:0;left:0;right:0;overflow:hidden}
.d-main.scroll{overflow:auto}
.tool-panel{position:relative;width:720px;margin:20px auto 0;height:672px;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);box-shadow:var(--it-glass-shadow);display:flex;flex-direction:column}
.d-page{position:relative;width:720px;margin:0 auto;padding:40px 0 120px}

/* ---------- tool shell ---------- */
.tool{position:relative;display:flex;flex-direction:column;height:100%;min-height:0}
.tb{display:flex;align-items:center;gap:2px;height:56px;padding:0 6px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(203,185,214,.5);flex:none}
.ibtn{width:44px;height:44px;flex:none;border:1px solid transparent;background:transparent;color:var(--dark-light);border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--light-hover)}
.a11y-dot{width:36px;height:36px;border-radius:50%;background:var(--bouquet);color:#fff;display:grid;place-items:center}
.dev-desktop .tb .a11y-ibtn{display:none}
.tb-title{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:0 4px}
.tb-names{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.tb-name{font-size:var(--t15);font-weight:600;line-height:1.25;color:var(--dark)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--t13);font-weight:500;line-height:1.35;color:var(--night-shadz);background:var(--it-badge-bg);border:1px solid rgba(167,55,100,.2);border-radius:999px;padding:0 8px}
.mark{--s:28px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f7eff4,#e9e6ec);border:1px solid rgba(185,123,160,.4);color:var(--night-shadz)}
.mark svg{fill:currentColor}
.stages{display:flex;gap:6px;list-style:none;margin:0;padding:6px 14px 7px;background:rgba(255,255,255,.94);flex:none}
.stages li{flex:1;display:flex;flex-direction:column;gap:3px;font-size:var(--t13);line-height:1.3;color:var(--dark-light)}
.stages li::before{content:"";display:block;height:0;border-top:2px dashed var(--it-field-border);border-radius:2px;margin-top:2px}
.stages li.done::before{border-top:4px solid var(--bouquet);margin-top:1px}
.stages li.cur{color:var(--night-shadz);font-weight:600}
.stages li.cur::before{border-top:6px solid var(--night-shadz);margin-top:0}
.disc{display:flex;align-items:center;gap:8px;padding:5px 14px;background:var(--light-hover);border-bottom:1px solid var(--mischka);font-size:var(--t14);line-height:1.4;color:var(--dark-light);flex:none}
.disc .ic{color:var(--dark-light)}
.disc-txt{flex:1}
.dev-mobile .disc-full{display:none}
.dev-desktop .disc-short{display:none}
.disc-more{border:0;background:transparent;color:var(--cadillac);font-weight:600;font-size:var(--t14);padding:4px 6px;min-height:32px;cursor:pointer;flex:none;border-radius:6px}
.offline{display:flex;gap:8px;align-items:flex-start;padding:8px 14px;background:var(--dark-light);color:#fff;font-size:var(--t14);line-height:1.45;flex:none}
.log{flex:1;min-height:0;overflow:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.log:focus{outline:none}
.log > *{flex-shrink:0}
.main-area{flex:1;min-height:0;overflow:auto;padding:18px 16px 24px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.user{justify-content:flex-end}
.mark-col{width:28px;flex:none}
.bubble{max-width:86%;padding:9px 14px;border-radius:20px;font-size:var(--tb);line-height:1.6;border:1px solid transparent;animation:it-in .22s cubic-bezier(.4,0,.2,1) both}
.bubble.bot{background:var(--it-bot-bg);border-color:var(--it-bot-border);border-start-start-radius:6px;box-shadow:0 4px 14px rgba(185,123,160,.07)}
.row.bot .bubble{max-width:calc(100% - 44px)}
.bubble.user{background:var(--it-user-bg);border-start-end-radius:6px;max-width:82%}
.bubble.user.unsent{border:1.5px dashed var(--it-error-ink)}
.bubble p + p{margin-top:6px}
.unsent-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:var(--t14);color:var(--it-error-ink);font-weight:500;margin-top:-4px}
.sum-label{display:flex;align-items:center;gap:6px;font-size:var(--t13);font-weight:600;color:var(--dark-light);margin-bottom:2px}
.typing{display:inline-flex;align-items:center;gap:10px;padding:10px 14px}
.bars{display:inline-flex;align-items:center;gap:3px;height:18px;color:var(--bouquet)}
.bars i{display:block;width:0;height:16px;border-inline-start:3px solid currentColor;border-radius:2px;transform-origin:center;animation:it-bar 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.9s;color:var(--cadillac)}
.bars i:nth-child(3){animation-delay:-.7s;color:var(--night-shadz)}
.bars i:nth-child(4){animation-delay:-.5s;color:var(--cadillac)}
.bars i:nth-child(5){animation-delay:-.3s}
.typing-t{font-size:var(--t14);color:var(--dark-light)}
.slow-t{display:block;font-size:var(--t14);color:var(--dark-light);margin:-4px 44px 0 0}
.sys{align-self:stretch;display:flex;gap:10px;align-items:flex-start;background:var(--light-hover);border:1px solid var(--it-hair);border-radius:12px;padding:12px 14px;font-size:var(--t15);line-height:1.55;animation:it-in .22s ease both}
.sys .ic{color:var(--dark-light);margin-top:2px}
.sys-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.newpill{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;bottom:84px;z-index:4;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:var(--night-shadz);color:#fff;font-size:var(--t14);font-weight:500;box-shadow:0 8px 20px rgba(167,55,100,.3);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px 6px;flex:none}
.chips.grid2{display:grid;grid-template-columns:1fr 1fr}
.chips.grid2 .chip.wide{grid-column:1/-1}
.chip{min-height:44px;padding:8px 16px;border-radius:22px;border:1.5px solid var(--bouquet);background:#fff;color:var(--night-shadz);font-size:var(--t15);font-weight:500;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;animation:it-in .22s ease both}
.chip:hover{background:var(--it-badge-bg)}
.chip.alt{border-color:var(--it-field-border);color:var(--dark)}
.chip.solid{background:var(--it-btn-grad);color:#fff;border-color:transparent}
.composer-wrap{flex:none;background:rgba(255,255,255,.95);border-top:1px solid rgba(203,185,214,.5)}
.c-hint{display:flex;gap:6px;align-items:center;padding:6px 16px 0;font-size:var(--t13);color:var(--dark-light)}
.c-hint.err{color:var(--it-error-ink);font-weight:500}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 10px}
.composer textarea{flex:1;min-height:48px;max-height:120px;resize:none;border-radius:24px;background:var(--it-field-bg);border:1.5px solid var(--it-field-border);padding:11px 16px;font:inherit;font-size:var(--t16);line-height:1.5;color:var(--dark);overflow:auto}
.composer textarea::placeholder{color:var(--it-placeholder)}
.composer textarea:focus{outline:none;border-color:var(--night-shadz);box-shadow:var(--it-ring)}
.composer textarea.over{border-color:var(--it-error-ink)}
.send{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid transparent;background:var(--it-btn-grad);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 15px rgba(167,55,100,.22)}
.send[aria-disabled="true"]{background:var(--mischka);color:var(--dark-light);box-shadow:none;cursor:not-allowed}
.counter{font-size:var(--t13);color:var(--dark-light);padding:0 18px 8px;margin-top:-4px;font-variant-numeric:tabular-nums}
.counter.lim{color:var(--it-error-ink);font-weight:600}
/* message over 32KB: not sent, shown beside the field (not a bubble); the text stays in the field and Send stays enabled */
.c-block{display:flex;gap:10px;align-items:flex-start;margin:8px 10px 0;padding:10px 12px;border:1.5px solid var(--it-error-ink);border-radius:12px;background:#fff;font-size:var(--t14);line-height:1.55;color:var(--dark)}
.c-block .ic{color:var(--it-error-ink);margin-top:2px}
.composer textarea.over{border-width:2px}

/* ---------- buttons ---------- */
.btn-p,.btn-s,.btn-dark,.btn-dark-o{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;border-radius:14px;font-size:var(--t17);font-weight:600;line-height:1.25;cursor:pointer;text-decoration:none;text-align:center;border:2px solid transparent;width:100%}
.btn-p{background:var(--it-btn-grad);color:#fff;box-shadow:0 8px 22px rgba(167,55,100,.22);transition:transform .3s ease,box-shadow .3s ease}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(167,55,100,.32);color:#fff;text-decoration:none}
.btn-s{background:#fff;color:var(--night-shadz);border-color:var(--bouquet)}
.btn-s:hover{background:var(--it-badge-bg);color:var(--night-shadz);text-decoration:none}
.btn-dark{min-height:64px;background:var(--secondary-dark);border-color:var(--secondary-dark);color:#fff;font-size:var(--t22);border-radius:16px}
.btn-dark:hover{color:#fff;text-decoration:none}
.btn-dark-o{background:#fff;border-color:var(--secondary-dark);color:var(--dark)}
.btn-dark-o:hover{color:var(--dark);text-decoration:none;background:var(--light-hover)}
/* buttons rendered as <a> must beat the generic ".screen a" link colour */
.screen a.btn-p,.screen a.btn-p:hover,.screen a.btn-dark,.screen a.btn-dark:hover,.screen a.site-cta,.screen a.site-cta:hover,.screen a.mail-btn.solid{color:#fff;text-decoration:none}
.screen a.btn-s,.screen a.btn-s:hover,.screen a.btn-sm,.screen a.mail-btn{color:var(--night-shadz);text-decoration:none}
.screen a.btn-dark-o,.screen a.btn-dark-o:hover,.screen a.way,.screen a.way:hover{color:var(--dark);text-decoration:none}
.dev-desktop .btn-p,.dev-desktop .btn-s{width:auto;min-width:220px}
.dev-desktop .btn-dark,.dev-desktop .btn-dark-o{max-width:420px}
.lnk{border:0;background:transparent;color:var(--cadillac);font-size:var(--t16);font-weight:500;padding:10px 8px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:start}
.lnk:hover{text-decoration:underline;color:var(--night-shadz)}
.lnk.danger{color:var(--it-error-ink)}
.btn-sm{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--bouquet);background:#fff;color:var(--night-shadz);font-size:var(--t15);font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.is-loading .bars{color:#fff}
.is-loading .bars i{height:14px}

/* ---------- FAQ card (S4) ---------- */
.faq{align-self:stretch;background:var(--it-faq-bg);border:1.5px solid var(--it-hoki-ink);border-radius:12px;padding:12px 14px;animation:it-in .22s ease both}
.faq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.faq-ic{width:34px;height:34px;flex:none;border-radius:9px;background:#fff;border:1px solid rgba(76,104,123,.35);color:var(--it-hoki-ink);display:grid;place-items:center}
.faq-topic{font-size:var(--t16);font-weight:600;color:var(--dark);line-height:1.3}
.faq-src{font-size:var(--t13);color:var(--it-hoki-ink);font-weight:500}
.faq-body{font-size:var(--tb);line-height:1.6}

/* ---------- outcome card (S5) ---------- */
.oc{--o-ink:var(--night-shadz);--o-tint:var(--it-user-bg);--o-title:var(--night-shadz);align-self:stretch;background:#fff;border:2px solid var(--o-ink);border-top-width:8px;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(40,42,43,.08);animation:it-in .3s .12s cubic-bezier(.4,0,.2,1) both;position:relative}
.oc:focus{outline:none}
.oc:focus-visible{outline:3px solid var(--night-shadz);outline-offset:3px}
.oc.o2{--o-ink:var(--it-hoki-ink);--o-tint:var(--it-faq-bg);--o-title:var(--it-hoki-ink)}
.oc.o3{--o-ink:var(--it-o3-ink);--o-tint:var(--light-hover);--o-title:var(--dark)}
.oc.o4{--o-ink:var(--it-bali-ink);--o-tint:var(--it-o4-bg);--o-title:var(--it-bali-ink)}
.oc.stale{border-style:dashed;border-top-width:2px;box-shadow:none}
.stale-tag{display:inline-flex;margin:12px 16px 0;font-size:var(--t13);font-weight:600;color:var(--dark-light);background:var(--light-hover);border:1px solid var(--it-field-border);border-radius:999px;padding:1px 10px}
.oc-head{display:flex;gap:12px;align-items:center;padding:16px 16px 4px}
.oc-icon{width:44px;height:44px;flex:none;border-radius:12px;background:var(--o-tint);border:1px solid transparent;color:var(--o-ink);display:grid;place-items:center}
.oc-eyebrow{font-size:var(--t13);font-weight:600;letter-spacing:.02em;color:var(--o-ink);line-height:1.3}
.oc-title{font-size:var(--t22);font-weight:500;line-height:1.3;color:var(--o-title);margin-top:2px}
.oc-body{padding:8px 16px 0;font-size:var(--t16);line-height:1.65}
.oc-important{display:flex;gap:10px;margin:12px 16px 0;background:var(--light-hover);border:1px solid transparent;border-inline-start:4px solid var(--it-o3-ink);border-radius:8px;padding:12px 14px;font-size:var(--t15);line-height:1.6}
.oc-important .ic{color:var(--it-o3-ink);margin-top:3px}
.when{margin:16px 16px 0}
.when h3,.refs h3{font-size:var(--t17);font-weight:600;color:var(--dark);margin-bottom:6px}
.when ul,.refs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.when li{display:flex;gap:10px;font-size:var(--t15);line-height:1.6}
.when li::before{content:"";flex:none;width:9px;height:9px;border:2px solid var(--it-o3-ink);border-radius:50%;margin-top:.5em}
.refs{margin:14px 16px 0}
.ref{border:1px solid #d5dbe1;border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:2px;font-size:var(--t15)}
.ref strong{font-size:var(--t16);font-weight:600}
.ref span{color:var(--dark-light)}
.ref a{display:inline-flex;align-items:center;gap:6px;min-height:32px}
.oc-actions{display:flex;flex-direction:column;gap:10px;padding:16px}
.oc-actions:empty{display:none}
.oc-door{font-size:var(--t15);line-height:1.6}
.oc-phone{font-size:var(--t15);text-align:center}
.oc-small{font-size:var(--t14);color:var(--dark-light);line-height:1.55}
.oc-noref{margin:14px 16px 0;padding:12px 14px;border:1px solid #d5dbe1;border-radius:12px;font-size:var(--t15)}
.oc-foot{display:flex;gap:8px;align-items:flex-start;padding:12px 16px;background:var(--light-hover);border-top:1px solid var(--it-hair);font-size:var(--t14);line-height:1.5;color:var(--dark-light)}
.oc-foot .ic{margin-top:2px}
.oc-foot-full{font-size:var(--t15);font-weight:500;color:var(--dark)}
.oc-after{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;padding:2px 0 8px}
.dev-desktop .oc-actions{flex-direction:row;flex-wrap:wrap;align-items:center}
.dev-desktop .oc-actions .oc-phone{text-align:start}

/* ---------- red flag (S6) ---------- */
.rf{position:absolute;inset:0;background:#fbf9fc;overflow:auto;display:flex;flex-direction:column}
.rf-top{display:flex;align-items:center;gap:8px;height:56px;flex:none;padding:0 14px 0 6px;background:#fff;border-bottom:1px solid #ebe7ef;font-size:var(--t14);color:var(--dark-light)}
.rf-top .grow{flex:1}
.dev-desktop .rf-top .a11y-ibtn{display:none}
.rf-body{padding:24px 18px 28px;width:100%;max-width:560px;margin:0 auto}
.rf-icon{width:56px;height:56px;border-radius:50%;border:2px solid var(--secondary-dark);color:var(--secondary-dark);display:grid;place-items:center;margin-bottom:14px}
.rf h1{font-size:var(--t28);font-weight:600;line-height:1.25;color:var(--dark);margin-bottom:16px}
.rf-action{background:#fff;border:2px solid var(--secondary-dark);border-inline-start-width:8px;border-radius:16px;padding:16px;font-size:var(--t19);line-height:1.5;font-weight:500;color:var(--dark);margin-bottom:16px}
.rf-action p + p{margin-top:6px}
.screen .rf-action a{color:var(--dark);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.rf-btns{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.rf-text{font-size:var(--t16);line-height:1.65;color:var(--dark-light)}
.rf-text p + p{margin-top:8px}
.rf-opt{font-size:var(--t14);color:var(--dark-light);margin:-6px 0 16px;display:flex;flex-direction:column;gap:6px}
.rf-sep{border:0;border-top:1px solid #e6e1ea;margin:20px 0}
.rf-passive{font-size:var(--t15);color:var(--dark-light)}
.rf-foot{margin-top:18px}
.rf-footer{font-size:var(--t13);color:var(--dark-light);margin-top:18px;line-height:1.5}
.rf-panel{background:#fbf9fc}
.rf-pending{padding:16px;border:2px dashed var(--it-field-border);border-radius:16px;font-size:var(--t15);color:var(--dark-light);background:#fff}
/* S6 combined (UX_SPEC draft 4): the extra hotline-tier blocks. Told apart from the main block by more than colour:
   h2 not h1, smaller type, a thinner frame with a 4px (not 8px) start bar, an outlined (not solid) button, and a hairline above. */
.rf-secline{font-size:var(--t15);line-height:1.55;color:var(--dark-light);margin:-6px 0 16px}
.rf-sec{margin-top:28px;padding-top:22px;border-top:1px solid #e6e1ea}
.rf-sec h2{font-size:var(--t22);font-weight:600;line-height:1.3;color:var(--dark);margin-bottom:12px}
.rf-sec h2:focus{outline:none}
.rf-action.sec{border-width:1.5px;border-inline-start-width:4px;border-radius:14px;padding:14px;font-size:var(--t17);margin-bottom:14px}
.rf-sec .rf-btns{margin-bottom:0}
.rf-main-end{margin-bottom:0}

/* ---------- forms (S1, S7) ---------- */
.hform{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.hform h2{font-size:var(--t22);font-weight:500;color:var(--night-shadz)}
.hform h2:focus{outline:none}
.lead{font-size:var(--t16);color:var(--dark-light)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--light-hover);border:1px solid var(--it-hair);border-radius:12px;padding:10px 12px;font-size:var(--t15)}
.errsum{border:2px solid var(--it-error-ink);border-radius:12px;padding:12px 14px;background:#fff;font-size:var(--t15)}
.errsum b{display:flex;gap:8px;align-items:center;color:var(--it-error-ink)}
.errsum ul{margin:6px 0 0;padding-inline-start:20px}
.preview{border:1px solid var(--it-hair);border-radius:14px;background:#fff;overflow:hidden}
.preview summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;font-weight:600;font-size:var(--t16);cursor:pointer;color:var(--dark)}
.preview summary::-webkit-details-marker{display:none}
.preview summary .grow{flex:1}
/* the arrow's direction is two separate SVGs swapped by [open], never rotate(): stop-animations zeroes transform (frontend consult, finding 5) */
.preview summary .chev .up{display:none}
.preview[open] summary .chev .up{display:inline-block}
.preview[open] summary .chev .down{display:none}
.pv{padding:2px 14px 12px;border-top:1px solid var(--it-hair)}
.pv dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:var(--t15)}
.pv dt{color:var(--dark-light)}
.pv dd{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:var(--t15);font-weight:600;color:var(--dark)}
.field input{min-height:52px;width:100%;border-radius:14px;background:var(--it-field-bg);border:1.5px solid var(--it-field-border);padding:12px 16px;font:inherit;font-size:var(--t16);color:var(--dark)}
.field input:focus{outline:none;border-color:var(--night-shadz);box-shadow:var(--it-ring);background:#fff}
.field input[dir="ltr"]{text-align:right}
.field input::placeholder{color:var(--it-placeholder)}
.field.err input{border:2px solid var(--it-error-ink)}
.err-msg{display:flex;gap:6px;align-items:center;font-size:var(--t14);font-weight:500;color:var(--it-error-ink)}
.fhint{font-size:var(--t14);color:var(--dark-light)}
.optgrp{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.optgrp legend{padding:0;margin-bottom:8px}
.segopts{display:flex;flex-wrap:wrap;gap:8px}
.segopt{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--it-field-border);background:#fff;font-size:var(--t15);color:var(--dark);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.segopt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--it-o3-ink);flex:none}
.segopt[aria-checked="true"]{border:2px solid var(--night-shadz);background:var(--it-badge-bg);color:var(--night-shadz);font-weight:600}
.segopt[aria-checked="true"] .dot{border:4px solid var(--night-shadz)}
.pending-tag{display:inline-block;font-size:var(--t12);font-weight:600;color:#6b4e00;background:#fff4d6;border:1px dashed #b38600;border-radius:999px;padding:0 8px;margin-inline-start:6px}
.cbx{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:var(--t15);line-height:1.55}
.cbx input{position:absolute;opacity:0;width:1px;height:1px}
.cbx .box{width:24px;height:24px;flex:none;border-radius:6px;border:2px solid var(--it-o3-ink);background:#fff;display:grid;place-items:center;color:transparent;margin-top:1px}
.cbx input:checked + .box{background:var(--night-shadz);border-color:var(--night-shadz);color:#fff}
.cbx input:focus-visible + .box{outline:3px solid var(--night-shadz);outline-offset:2px}
.cbx.err .box{border-color:var(--it-error-ink);border-width:2.5px}
.privacy{font-size:var(--t14);color:var(--dark-light)}
.errbox{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--it-error-ink);border-radius:12px;padding:12px 14px;background:#fff;font-size:var(--t15)}
.errbox .ic{color:var(--it-error-ink);margin-top:2px}
.alt-ways{display:flex;flex-direction:column;gap:8px}
.way{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--it-hair);border-radius:14px;background:#fff;color:var(--dark);font-size:var(--t16);font-weight:500;text-decoration:none}
.way:hover{text-decoration:none;color:var(--dark);border-color:var(--bouquet)}
.way .wic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--light-hover);color:var(--dark-light);flex:none}
.way .wic.wa{color:var(--wa-dark)}
.way .grow{flex:1}

/* ---------- S1 / S2 / S0 page content ---------- */
.intro{position:relative;padding:22px 16px 28px}   /* the 112px bottom room for the floating buttons now belongs to the footer (.tool-ft) */
.dev-desktop .intro{padding:8px 0 40px}
.intro h1{font-size:var(--t34);font-weight:500;line-height:1.2;color:var(--night-shadz)}
.dev-desktop .intro h1{font-size:calc(var(--u)*44)}
.intro .sub{font-size:var(--t17);color:var(--dark-light);margin-top:10px}
.greet{display:flex;gap:12px;align-items:flex-start;margin:20px 0 6px}
.greet .mark{--s:44px}
.greet-t{font-size:var(--t16);line-height:1.65}
.greet-t span:first-child{font-weight:600}
.not-this{display:flex;gap:8px;align-items:flex-start;font-size:var(--t14);color:var(--dark-light);margin:14px 0 0}
.steps{list-style:none;margin:20px 0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:var(--t16);line-height:1.55}
.num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--it-badge-bg);color:var(--night-shadz);font-weight:600;border:1px solid rgba(167,55,100,.22)}
.ccard{background:rgba(255,255,255,.82);border:1px solid rgba(203,185,214,.65);border-radius:20px;padding:20px 18px;box-shadow:0 10px 35px rgba(185,123,160,.08);margin-top:6px}
.ccard h2{font-size:var(--t22);font-weight:500;color:var(--night-shadz);margin-bottom:10px}
.dlist{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:9px}
.dlist li{display:flex;gap:10px;font-size:var(--t15);line-height:1.6}
.dlist li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--it-o3-ink);margin-top:.65em}
.dlist li.em{font-weight:500}
.dlist li.em::before{display:none}
.dlist li.em .ic{color:var(--secondary-dark);margin-top:2px}
.c-acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.dev-desktop .c-acts{flex-direction:row;align-items:center}
.c-acts-equal,.dev-desktop .c-acts-equal{flex-direction:column;align-items:stretch}
.dev-desktop .c-acts-equal .btn-s{width:100%}
.direct{margin-top:22px;font-size:var(--t15);color:var(--dark-light)}
.direct-ways{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.notice{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--it-hair);border-inline-start:4px solid var(--it-hoki-ink);border-radius:12px;padding:12px 14px;font-size:var(--t15);margin-bottom:16px}
.notice .ic{color:var(--it-hoki-ink);margin-top:2px}
.rcard{background:rgba(255,255,255,.88);border:1px solid rgba(203,185,214,.65);border-radius:20px;padding:20px 18px;box-shadow:0 10px 35px rgba(185,123,160,.08);margin-top:22px}
.rcard-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.rcard-h .rci{width:44px;height:44px;border-radius:12px;background:var(--it-badge-bg);color:var(--night-shadz);display:grid;place-items:center;flex:none}
.rcard p{font-size:var(--t16)}
.toast{position:absolute;top:12px;left:0;right:0;margin-inline:auto;width:fit-content;z-index:8;background:var(--dark-light);color:#fff;border-radius:12px;padding:10px 16px;font-size:var(--t14);box-shadow:0 8px 20px rgba(0,0,0,.18);max-width:90%}
/* entry points */
.pill-tag{display:inline-flex;align-items:center;gap:6px;font-size:var(--t13);font-weight:500;color:var(--night-shadz);background:var(--it-badge-bg);border:1px solid rgba(167,55,100,.15);border-radius:999px;padding:3px 12px}
.hero{padding:26px 18px 30px;position:relative}
.hero h1{font-size:var(--t34);font-weight:500;color:var(--night-shadz);margin:12px 0 4px}
.hero .hsub{font-size:var(--t19);color:var(--dark-light)}
.hero .hbody{font-size:var(--t15);color:var(--dark-light);margin-top:10px}

/* ---------- motion ---------- */
@keyframes it-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes it-fade{from{opacity:0}to{opacity:1}}
@keyframes it-bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.screen.sim-noanim *,.screen.sim-noanim *::before,.screen.sim-noanim *::after{animation:none!important;transition:none!important;transform:none!important;scroll-behavior:auto!important} /* = body.stop-animations in src/styles/accessibility.css: it zeroes transform too, so nothing in the tool may depend on transform */
.screen.sim-noanim .bars i:nth-child(1){height:7px}.screen.sim-noanim .bars i:nth-child(2){height:12px}.screen.sim-noanim .bars i:nth-child(3){height:16px}.screen.sim-noanim .bars i:nth-child(4){height:11px}.screen.sim-noanim .bars i:nth-child(5){height:6px}
@media (prefers-reduced-motion: reduce){
  .screen *,.screen *::before,.screen *::after{animation:none!important;transition:none!important}
  .screen .bars i:nth-child(1){height:7px}.screen .bars i:nth-child(2){height:12px}.screen .bars i:nth-child(3){height:16px}.screen .bars i:nth-child(4){height:11px}.screen .bars i:nth-child(5){height:6px}
  .log{scroll-behavior:auto}
}

/* ---------- the tool page's own static header and footer (COMPONENTS §3.23): plain links, no Firestore, no third party ---------- */
.tool-hd .logo-link{display:inline-flex;text-decoration:none}
.screen .tool-hd a.logo-link:hover{text-decoration:none}
.tool-hd .back-site{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid var(--bouquet);border-radius:999px;background:#fff;color:var(--night-shadz);font-size:var(--t15);font-weight:600;white-space:nowrap}
.screen .tool-hd a.back-site,.screen .tool-hd a.back-site:hover{color:var(--night-shadz);text-decoration:none}
.m-page.nohdr{top:28px}   /* the tool page's header is not fixed: it scrolls with the page (inside .page-scroll / .d-main) */
.d-main.nohdr{top:0}
.tool-ft{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:0 24px;border-top:1px solid rgba(101,139,164,.15);background:#fff;padding:14px 16px 112px;font-size:var(--t15)}
.dev-desktop .tool-ft{padding:12px 48px 24px}
.tool-ft a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:500}
.screen .tool-ft a.back-foot{color:var(--night-shadz);font-weight:600}

/* ---------- closed update 3 (accessibility consult round 2, UX 4.2) ---------- */
/* chrome: a visible mirror of what the single announcer was given (the mirror itself is not a live region) */
.ch-ann{margin:-4px 0 10px;font-size:13px;color:var(--c-muted);background:var(--c-surface-2);border:1px dashed var(--c-border);border-radius:10px;padding:6px 10px;min-height:32px}
.ch-ann-l{font-weight:600;color:var(--c-text)}
/* "הצגת יעד המיקוד": where focus lands on a screen change (a design aid, not part of the product) */
.screen.show-focus [data-focus]{outline:3px dashed #14795a!important;outline-offset:3px}
/* the transcript is a labelled region (section) holding an ol; every message, system line and card is an li */
.msgs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.msgs > li{flex-shrink:0}
/* short height / 400% zoom: the fixed bars are released into the scroll flow in steps, the input stays the only fixed part.
   rel1: stage indicator scrolls with the content · rel2: + the top bar · rel3: + the disclaimer, now the first item of the transcript.
   Same DOM and same focus order in every step; only "sticky" turns into "static" (no remount, so focus and scroll survive a step change). */
.tool.short{display:block;overflow-y:auto;overflow-x:hidden;scroll-padding-bottom:84px}
.tool.short > .log,.tool.short > .main-area{overflow:visible;flex:none}
.tool.short > .composer-wrap{position:sticky;bottom:0;z-index:6}
.tool.short > .tb{position:sticky;top:0;z-index:5}
.tool.short > .disc{position:sticky;top:56px;z-index:4}
.tool.short.rel2 > .tb,.tool.short.rel3 > .tb{position:static}
.tool.short.rel2 > .disc{top:0}
.device.m.framed{border-radius:22px}
.flow-disc{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;background:var(--light-hover);border:1px solid var(--it-hair);border-radius:12px;font-size:var(--t14);line-height:1.5;color:var(--dark-light)}
.flow-disc .ic{margin-top:2px}
/* S13b copy: success is plain visible text (announced through the announcer, focus stays on the button); failure reveals the details as selectable text */
.copy-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.copied-note{display:inline-flex;align-items:center;gap:6px;font-size:var(--t14);font-weight:500;color:var(--dark-light)}
.copy-failed{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:var(--t15);font-weight:500;color:var(--dark)}
.copy-failed .ic{color:var(--it-error-ink);margin-top:2px}
.payload{display:block;width:100%;margin-top:8px;font-size:var(--t16);line-height:1.6;color:var(--dark);background:var(--it-field-bg);border:1.5px solid var(--it-field-border);border-radius:14px;padding:10px 14px;overflow-wrap:break-word}
.payload .nb{white-space:nowrap}
.payload:focus{outline:none;border-color:var(--night-shadz);box-shadow:var(--it-ring)}

/* ---------- simulation of AccessibilityWidget "high contrast" (mirrors src/styles/accessibility.css) ---------- */
/* the a11y panel is always a direct child of .screen and is excluded, like .accessibility-widget on the site */
.screen.sim-hc,.screen.sim-hc > :not(.a11y-panel),.screen.sim-hc > :not(.a11y-panel) *{background-color:#fff!important;color:#000!important;border-color:#000!important;box-shadow:none!important;text-shadow:none!important;background-image:none!important}
.screen.sim-hc > :not(.a11y-panel) a{text-decoration:underline!important;color:#0000EE!important}
.screen.sim-hc > :not(.a11y-panel) button,.screen.sim-hc input,.screen.sim-hc textarea{border:2px solid #000!important;background:#fff!important;color:#000!important}
.screen.sim-hc .oc{border-width:2px!important;border-top-width:8px!important}
.screen.sim-hc .oc.stale{border-top-width:2px!important}
.screen.sim-hc .btn-dark{border-width:3px!important}
.screen.sim-hc .miss{border-style:dashed!important}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fill(s, ctx={}){
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(\{\{privacy_url\}\}\)/g,'<a href="#" data-noop>$1</a>');
  s = s.replace(/\{\{hadas_phone\}\}/g,()=>`<a href="#" data-noop dir="ltr">${ctx.call_name?`<span class="sr">${t('a11y.call_hadas')} </span>`:''}${PHONE}</a>`);

}
function isMissing(id){return T[id]===undefined;}

}

function bot(html,{first=true,anchor=false,cls='',q=false,focus=false}={}){
  // q: a closed question with quick-reply buttons under it. The buttons sit BEFORE the input in the DOM, so the question text carries
  // the id that names the group (aria-labelledby), and the message ends with a visually hidden hint that there are options (a11y.buttons_hint).
  const inner = q ? `<div id="q-cur">${html}</div><span class="sr q-hint"> ${t('a11y.buttons_hint')}</span>` : html;
  return `<li class="row bot"${anchor?' id="anchor"':''}><span class="mark-col">${first?mark(28):''}</span><div class="bubble bot ${cls}"${focus?' tabindex="-1" data-focus':''}><span class="sr">${tv('chat.sr.bot_label')} </span>${inner}</div></li>`;
}
function user(text,{unsent=false}={}){return `<li class="row user"><div class="bubble user${unsent?' unsent':''}"><span class="sr">${tv('chat.sr.user_label')} </span>${esc(text)}</div></li>` + (unsent?`<li class="unsent-row">${I('alert',16)} ${t('chat.not_sent')} <button class="btn-sm" data-go="S3/waiting">${I('retry',16)} ${t('error.retry.button')}</button></li>`:'');}
function typing({slow=false}={}){return `<li class="row bot"><span class="mark-col">${mark(28)}</span><div class="bubble bot typing">${BARS}<span class="typing-t">${t('chat.typing')}</span></div></li>${slow?`<li class="slow-t">${t('chat.slow')}</li>`:''}`;}
function sys(html, acts=''){return `<li class="sys">${I('info',20)}<div>${html}${acts?`<div class="sys-acts">${acts}</div>`:''}</div></li>`;}
function chips(list,{grid=false,noq=false}={}){return `<div class="chips${grid?' grid2':''}" role="group" ${noq?`aria-label="${esc(tv('a11y.quick_replies'))}"`:'aria-labelledby="q-cur"'}>${list.join('')}</div>`;}
function chip(html,{alt=false,wide=false,solid=false,go='',demo='',icon=''}={}){return `<button type="button" class="chip${alt?' alt':''}${wide?' wide':''}${solid?' solid':''}"${go?` data-go="${go}"`:''}${demo?` data-demo="${demo}"`:''}>${icon?I(icon,18):''}${html}</button>`;}
function composer({value='',state='idle',focus=true}={}){
  const wait = state==='wait', over = state==='toolong', block = state==='block';
  // None of the lines around the field is a live region (COMPONENTS §7.1): the one announcer says them. They are plain elements.
  // Over 800 chars: a soft, non-blocking hint only. Sending is never blocked (SEC-06, UX S3) —
  // the flags-only check and meta.too_long bubble happen after send, not here.
  const hint = wait ? `<div class="c-hint">${I('clock',15)} ${t('chat.send.wait')}</div>` : over ? `<div class="c-hint">${I('info',15)} ${t('chat.input.too_long_hint')}</div>` : '';
  const counter = over ? `<div class="counter">812 / 800</div>` : '';
  // Over 32KB (checked in the browser, before sending): nothing was sent, so no flags check ran on it. The message sits
  // beside the field, not in the transcript; it replaces the soft hint and counter; the text stays; Send stays enabled.
  const blockMsg = block ? `<div class="c-block" id="cmp-block">${I('alert',20)}<p>${t('chat.input.too_long_block')}</p></div>` : '';
  const dis = (wait||(!value && state!=='idle-active' && !block)) ? 'true':'false';
  return `<div class="composer-wrap">${hint}${blockMsg}<div class="composer"><label class="sr" for="cmp">${tv('chat.input.placeholder')}</label><textarea id="cmp" rows="1"${block?' class="over" aria-invalid="true" aria-describedby="cmp-block"':''} placeholder="${esc(tv('chat.input.placeholder'))}" data-composer${focus?' data-focus':''}>${esc(value)}</textarea><button type="button" class="send" aria-label="${esc(tv('chat.send.label'))}" aria-disabled="${dis}" data-send>${I('send',22,2.2)}</button></div>${counter}</div>`;
}

function shell(o){

  // The transcript is a labelled region (section + a11y.log_label), NOT role="log" and NOT aria-live: the announcer outside this tree says

  const flowDisc = sh>=3 ? `<li class="flow-disc">${I('info',16)}<span>${t('chat.disclaimer_line')}</span></li>` : '';
  const center = o.main!=null ? `<div class="main-area" tabindex="-1">${o.main}</div>` : `<section class="log" aria-label="${esc(tv('a11y.log_label'))}" tabindex="0" data-scroll="${o.scroll||'bottom'}"><ol class="msgs">${flowDisc}${o.log||''}</ol></section>`;
  return `<div class="tool${sh?` short rel${sh}`:''}">${topbar()}${o.banner||''}${stages(o.stage||1)}${sh>=3?'':disc()}${center}${o.pill?`<button type="button" class="newpill" aria-label="${esc(tv('a11y.new_message_pill'))}" data-act="tobottom">${I('down',16,2)} ${t('chat.new_message')}</button>`:''}${o.quick||''}${o.composer===false?'':composer({...(o.composer||{}),focus:!o.overlay})}${o.overlay||''}</div>`;
}

  const one = (n)=>`<li class="ref"><strong>${vchip('referral_name')} <span class="oc-small">#${n}</span></strong><span>${vchip('referral_description')}</span><a href="#" data-noop>${vchip('referral_contact')} ${I('ext',16)}<span class="sr"> ${tv('outcome.4.external_hint')}</span></a></li>`;
  return `<div class="refs"><ul>${one(1)}${one(2)}</ul><p class="oc-small" style="margin-top:6px">${t('outcome.4.referral_item')} <span>(תבנית הפריט — רשימת ההפניות של הדס)</span></p></div>`;
}
function oc(n,{stale=false,noref=false}={}){
  const icon={1:'route',2:'talk',3:'notes',4:'sign'}[n];
  let body='', extra='', acts='';
  if (n===1||n===2){ body=`<p>${t(`outcome.${n}.body`)}</p>`; acts=ctaForm()+ctaPhone(); }
  if (n===3){ const b=tl('outcome.3.body'); body=`<p>${b[0]}</p>`; extra=`<div class="oc-important">${I('info',18)}<p>${b[1]}</p></div>`+whenList(); acts=`<p class="oc-door">${t('outcome.3.door_open')}</p>`+ctaForm()+ctaPhone(); }
  if (n===4){ body=`<p>${t('outcome.4.body')}</p>`; extra = noref?`<p class="oc-noref">${t('outcome.4.no_referral')}</p>`:refList(); acts=`${noref?'':`<p class="oc-small">${t('outcome.4.referral_disclaimer')}</p>`}<p class="oc-small">${t('outcome.4.misunderstood')}</p>`; }
  const disc = n===3 ? `<div class="oc-foot oc-foot-full">${I('info',16)}<p>${t('outcome.3.disclaimer')}</p></div>` : `<div class="oc-foot">${I('info',16)}<p>${t('outcome.disclaimer')}</p></div>`;
  return `<li class="li-oc"><section class="oc o${n}${stale?' stale':''}" aria-labelledby="oc-t">${stale?`<span class="stale-tag">${t('outcome.stale_label')}</span>`:''}<div class="oc-head"><span class="oc-icon">${I(icon,24)}</span><div><div class="oc-eyebrow">${t('outcome.card.label')}</div><h2 class="oc-title" id="oc-t">${t(`outcome.${n}.title`)}</h2></div></div><div class="oc-body">${body}</div>${extra}<div class="oc-actions">${stale?'':acts}</div>${disc}</section></li>`;
}
function summaryBubble(focus=true){return bot(`<div class="sum-label">${t('outcome.summary.label')}</div><p>${model(SB.sum,'VOICE 3.8')}</p>`,{cls:'summary',focus});}  // S5: the one focus target (tabindex -1), no announcement; the card follows it in the DOM
function outcomeLog(n,o={}){
  const sum = o.fallback ? bot(t('outcome.summary.fallback'),{focus:true}) : summaryBubble();
  // "סיום ומחיקה" always opens the delete dialog first (S11); the dialog's own confirm is the DELETE (D-01).
  return LOG.D + user(SU.u5) + bot(t('transition.to_outcome'),{anchor:true}) + sum + oc(n,o) + (o.stale?'':`<li class="oc-after">${lnk(t('outcome.add_more'),'S5/reopened')}${lnk(t('outcome.finish'),'S11/delete')}</li>`);
}

/* ---- red flag ---- */
function rfTop(){return `<div class="rf-top">${mark(28)}<span class="grow">${t('chat.header.title')}</span><button type="button" class="ibtn a11y-ibtn" aria-label="תפריט נגישות" data-act="a11y"><span class="a11y-dot">${I('a11y',20,2)}</span></button></div>`;}
function rf(variant){
  // Tiers: emergency / urgent / hotline (D-04). A secondary form only ever appears for urgent ALONE: any other flag in the
  // same conversation cancels it (UX_SPEC S6, draft 4). No ER button anywhere: in an emergency, one 101 button plus one text line.
  // Closed update 3: NO role="alert" and NO aria-live anywhere on this screen. One mechanism only: focus goes to the h1 once the screen
  // is painted (the input that had focus was removed from the DOM), and the announcer is emptied on entry. The 101 button's accessible
  // name is redflag.cta.call.a11y@v2 ("חיוג ל-101, מד"א"): it opens with the visible text (WCAG 2.5.3).
  const tier = (variant==='emergency'||variant==='combined3') ? 'emergency' : (variant==='urgent'||variant==='urgent-noform'||variant==='combined') ? 'urgent' : 'hotline';
  let action='', btns='', secline='', after='', secs='';
  const n101 = `aria-label="${esc(tv('redflag.cta.call.a11y'))}" data-atid="redflag.cta.call.a11y@v2"`;
  const call101 = `<a href="#" data-noop class="btn-dark" ${n101} data-track-ignore="true">${I('phone',26,2)}${t('redflag.cta.call')}</a>`;
  const call1201o = `<a href="#" data-noop class="btn-dark-o" data-track-ignore="true">${I('phone',22,2)}${t('redflag.cta.call_1201')}</a>`;
  const childPend = `<p class="oc-small" style="margin-top:8px"><span class="pending-tag">טיוטה — ממתין לאישור עו"ד על חובת דיווח</span></p>`;
  // A secondary block is complete in itself: its own h2 (titled by flag type: .distress / .child_safety), its own text, its own action.
  const sec = (n, titleId, inner, b='')=>`<section class="rf-sec" aria-labelledby="rf-sec-${n}"><h2 id="rf-sec-${n}">${t(titleId)}</h2><div class="rf-action sec">${inner}</div>${b?`<div class="rf-btns">${b}</div>`:''}</section>`;
  if (variant==='emergency'){
    action = `<div class="rf-action"><p>${t('redflag.type.sudden_onset')}</p></div>`;
    btns = call101;
    secline = `<p class="rf-secline">${t('redflag.secondary.emergency')}</p>`;
    after = `<hr class="rf-sep"><p class="rf-passive">${t('redflag.after.emergency')}</p>`;
  } else if (variant==='urgent'){ // form: secondary (Hadas approved it, and no other flag forbids it)
    action = `<div class="rf-action"><p>${t('redflag.type.swallowing')}</p></div>`;
    after = `<hr class="rf-sep"><p class="rf-passive">${t('redflag.after')}</p><div style="margin-top:12px">${btnS(t('redflag.cta.form'),'S7/default')}</div><p class="oc-small" style="margin-top:6px"><span class="pending-tag">רק באישור הדס (D-04)</span></p>`;
  } else if (variant==='urgent-noform'){ // form: none (Hadas did not approve a secondary form, or another flag forbids it): the closing line makes no form promise
    action = `<div class="rf-action"><p>${t('redflag.type.swallowing')}</p></div>`;
    after = `<hr class="rf-sep"><p class="rf-passive">${t('redflag.after.no_form')}</p>`;
  } else if (variant==='hotline-distress'){
    action = `<div class="rf-action"><p>${t('redflag.type.distress',{subject_ref:'יוסי'})}</p></div>`;
    btns = `<a href="#" data-noop class="btn-dark" data-track-ignore="true">${I('phone',26,2)}${t('redflag.cta.call_1201')}</a><a href="#" data-noop class="btn-dark-o" ${n101} data-track-ignore="true">${I('phone',22,2)}${t('redflag.cta.call')}</a>`;
  } else if (variant==='hotline-child'){ // no dedicated CTA id yet (texts.he.json has no redflag.cta.* for 118/100) — message only, no form (D-04), pending legal sign-off on the message itself.
    action = `<div class="rf-action"><p>${t('redflag.type.child_safety')}</p>${childPend}</div>`;
  } else if (variant==='combined'){ // developmental regression (urgent) + child safety (hotline): the UX_SPEC S6 example. The form is blocked, so the urgent block closes with redflag.after.no_form (not redflag.after, no redflag.cta.form).
    action = `<div class="rf-action"><p>${t('redflag.type.child_regression')}</p></div>`;
    after = `<p class="rf-passive rf-main-end">${t('redflag.after.no_form')}</p>`;
    secs = sec(1, 'redflag.title.hotline.child_safety', `<p>${t('redflag.type.child_safety')}</p>${childPend}`);
  } else { // combined3: emergency + distress + child safety = the 3-block maximum
    action = `<div class="rf-action"><p>${t('redflag.type.sudden_onset')}</p></div>`;
    btns = call101;
    secline = `<p class="rf-secline">${t('redflag.secondary.emergency')}</p>`;
    after = `<p class="rf-passive rf-main-end">${t('redflag.after.emergency')}</p>`;
    secs = sec(1, 'redflag.title.hotline.distress', `<p>${t('redflag.type.distress',{subject_ref:'יוסי'})}</p>`, call1201o) + sec(2, 'redflag.title.hotline.child_safety', `<p>${t('redflag.type.child_safety')}</p>${childPend}`);
  }
  const footer = `<p class="rf-footer">${t('redflag.footer')}</p>`;
  return `<div class="rf">${rfTop()}<div class="rf-body"><span class="rf-icon">${I('pause',26,2.4)}</span><h1 tabindex="-1" data-focus>${t('redflag.title.'+tier)}</h1>${action}${btns?`<div class="rf-btns">${btns}</div>`:''}${secline}${after}${secs}${footer}<div class="rf-foot">${lnk(I('back',18)+t('nav.back_to_site'),'S0/contact')}</div></div></div>`;
}

/* ---- handoff form ---- */
function form(st){
  const errs = st==='errors', sending = st==='sending', failed = st==='failed'||st==='failed2';
  const pv = `<details class="preview"${st==='preview'?' open':''}><summary>${I('mail',20)}<span class="grow">${t('form.preview.title')}</span><span class="chev"><span class="down">${I('chev',20)}</span><span class="up">${I('chevu',20)}</span></span></summary><div class="pv"><dl><dt>${t('form.preview.row.who')}</dt><dd>הורה</dd><dt>${t('form.preview.row.about')}</dt><dd>הבן, יוסי</dd><dt>${t('form.preview.row.age')}</dt><dd>4</dd><dt>${t('form.preview.row.topic')}</dt><dd>"נתקע במילים"</dd><dt>${t('form.preview.row.facts')}</dt><dd>"כבר כמה חודשים" · "בעיקר כשהוא נלהב לספר משהו" · "הגננת אמרה שאולי כדאי לבדוק שמיעה"</dd></dl><span class="oc-small">דוגמת חילוץ — הערכים מגיעים מהתיק</span><div>${lnk(t('form.preview.fix'),'S3/typing')}</div></div></details>`;
  const fName = `<div class="field${errs?' err':''}"><label for="f-name">${t('form.name.label')}</label><input id="f-name" autocomplete="given-name" ${errs?'aria-invalid="true" aria-describedby="e-name" data-focus':''} value="${errs?'':'מיכל'}">${errs?`<span class="err-msg" id="e-name">${I('alert',16)} ${t('form.validation.name_missing')}</span>`:''}</div>`;
  const fPhone = `<div class="field${errs?' err':''}"><label for="f-phone">${t('form.phone.label')}</label><input id="f-phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" ${errs?'aria-invalid="true" aria-describedby="e-phone"':'aria-describedby="h-phone"'} value="${errs?'050-12':'050-1234567'}"><span class="fhint" id="h-phone">${t('form.phone.hint')}</span>${errs?`<span class="err-msg" id="e-phone">${I('alert',16)} ${t('form.validation.phone_format')}</span>`:''}</div>`;
  const seg = (ids,sel)=>`<div class="segopts" role="radiogroup">${ids.map((id,i)=>`<button type="button" class="segopt" role="radio" aria-checked="${i===sel}"><span class="dot"></span>${t(id)}</button>`).join('')}</div>`;
  const fTime = `<fieldset class="optgrp"><legend class="flabel">${t('form.best_time.label')} <span class="pending-tag">ממתין לאישור אליה והדס</span></legend>${seg(['form.best_time.morning','form.best_time.noon','form.best_time.evening'],2)}</fieldset>`;
  const fChan = `<fieldset class="optgrp"><legend class="flabel">${t('form.channel_pref.label')} <span class="pending-tag">ממתין לאישור</span></legend>${seg(['form.channel_pref.call','form.channel_pref.whatsapp'],-1)}</fieldset>`;
  const fCons = `<div><label class="cbx${errs?' err':''}"><input type="checkbox" ${errs?'aria-invalid="true" aria-describedby="e-cons"':'checked'}><span class="box">${I('check',16,3)}</span><span>${t('form.consent.checkbox')}</span></label>${errs?`<span class="err-msg" id="e-cons" style="margin-top:6px">${I('alert',16)} ${t('form.validation.consent_missing')}</span>`:''}</div>`;
  const sum = errs ? `<div class="errsum"><b>${I('alert',18)} ${t('form.errors_summary',{error_count:'3'})}</b><ul><li><a href="#f-name" data-noop>${tv('form.validation.name_missing')}</a></li><li><a href="#f-phone" data-noop>${tv('form.validation.phone_format')}</a></li><li><a href="#" data-noop>${tv('form.validation.consent_missing')}</a></li></ul></div>`:'';

  const fail2 = st==='failed2' ? `<p class="lead">${t('error.form_send_repeat')}</p><div class="alt-ways"><a href="#" data-noop class="way"><span class="wic wa">${I('wa',22)}</span><span class="grow">${t('fallback.whatsapp')}</span>${I('chevl',18)}</a><a href="#" data-noop class="way"><span class="wic">${I('phone',20)}</span><span class="grow">${t('fallback.phone')} · <span dir="ltr">${PHONE}</span></span>${I('chevl',18)}</a></div>`:'';

}

/* ---- confirm, fallback ---- */
function confirmScr(v){
  // D-01 / legal: the conversation content is deleted from the device AND the server — form.confirmation.privacy
  // says so explicitly. form.confirmation.redflag_reminder only appears after a form sent from the urgent red-flag screen.
  // delivery: pending (privacy_pending, both_pending) swaps the title, "what now" and "when" for their .pending variants (UX S8, 4.1).
  // The privacy line is one of four, by the server's answer: delivered / pending / delete_pending / both_pending.
  const pend = v==='privacy_pending' || v==='both_pending';
  const priv = v==='both_pending' ? 'form.confirmation.privacy.both_pending' : v==='privacy_pending' ? 'form.confirmation.privacy.pending' : v==='privacy_delete' ? 'form.confirmation.privacy.delete_pending' : 'form.confirmation.privacy';
  return `<div class="confirm"><span class="cf-icon">${I('mail',28)}</span><h2 tabindex="-1" data-focus>${t(pend?'form.confirmation.title.pending':'form.confirmation.title')}</h2>${v==='afterflag'?`<div class="cf-rf">${t('form.confirmation.redflag_reminder')}</div>`:''}<p>${t(pend?'form.confirmation.what_now.pending':'form.confirmation.what_now')}</p>${v==='other'?`<p class="cf-line">${I('info',18)}<span>${t('form.confirmation.who',{subject_ref:'יוסי'})}</span></p>`:''}<p class="cf-line">${I('phone',18)}<span>${t('form.confirmation.from_number',{callback_number:PHONE})}</span></p><p>${t(pend?'form.confirmation.when.pending':'form.confirmation.when',{response_time:'עד סוף יום העבודה הבא'})}</p><p class="cf-line">${I('info',18)}<span>${t('form.confirmation.fallback',{followup_time:'מחר בצהריים'})}</span></p><p class="cf-line">${I('alert',18)}<span>${t('form.confirmation.disclaimer')}</span></p><p class="cf-small">${t('form.confirmation.add_later')}</p><p class="cf-small">${t(priv)}</p><div style="margin-top:6px">${btnS(t('nav.back_to_site'),'S0/contact')}</div></div>`;
}
function fallbackScr(v){
  const body = v==='ratelimit' ? t('error.rate_limit') : t('system.unavailable');
  return `<div class="fallback"><span class="cf-icon">${I(v==='ratelimit'?'clock':'cloudoff',28)}</span><h2 tabindex="-1" data-focus>${t('fallback.title')}</h2><p>${body}</p>${v==='midchat'?`<p class="cf-line">${I('info',18)}<span>${t('fallback.saved',{expiry_clause:'השיחה תימחק אוטומטית תוך 24 שעות.'})}</span></p>`:''}<div class="alt-ways"><a href="#" data-noop class="way"><span class="wic wa">${I('wa',22)}</span><span class="grow">${t('fallback.whatsapp')}</span>${I('chevl',18)}</a><a href="#" data-noop class="way"><span class="wic">${I('phone',20)}</span><span class="grow">${t('fallback.phone')} · <span dir="ltr">${PHONE}</span></span>${I('chevl',18)}</a><a href="#" data-noop class="way"><span class="wic">${I('page',20)}</span><span class="grow">${t('fallback.contact')}</span>${I('chevl',18)}</a></div>${v==='ratelimit'?`<div>${btnS(t('error.retry.button'),'S3/typing')}</div>`:''}<p class="cf-small">קישור הוואטסאפ נושא רק טקסט כללי (fallback.whatsapp_prefill) — בלי תוכן מהשיחה.</p></div>`;
}

/* ---- intro page (S1) ---- */
function intro(st){
  const steps = tl('page.tool.steps');
  const dl = tl('consent.disclaimer');
  const greet = tl('intro.greeting');
  const missing = st==='missing', loading = st==='loading';
  // consent.disclaimer and consent.emergency are separate text ids (texts.he.json v0.3.0), but the UI still
  // merges them into one visually-highlighted box, right after the first bullet, so 101 shows on the first screen.
  const discItems = [`<li><span>${dl[0]}</span></li>`, `<li class="em">${I('phone',18,2)}<span>${t('consent.emergency')}</span></li>`, ...dl.slice(1).map(x=>`<li><span>${x}</span></li>`)];
  const discList = `<ul class="dlist">${discItems.join('')}</ul>`;
  const cbx = `<label class="cbx${missing?' err':''}"><input type="checkbox" id="consent-cb" ${missing?'aria-invalid="true" aria-describedby="e-consent"':''} ${loading?'checked':''}><span class="box">${I('check',16,3)}</span><span>${t('consent.checkbox')}</span></label>${missing?`<span class="err-msg" id="e-consent" style="margin-top:8px">${I('alert',16)} ${t('consent.checkbox.error')}</span>`:''}`;

  const declined = `<div class="notice" tabindex="-1" data-focus>${I('info',20)}<div><p>${t('consent.declined')}</p><div class="direct-ways" style="margin-top:10px"><a href="#" data-noop class="btn-sm">${I('phone',16)} <span dir="ltr">${PHONE}</span></a><a href="#" data-noop class="btn-sm">${I('wa',16)} וואטסאפ</a><a href="#" data-noop class="btn-sm">${I('page',16)} דברו איתי</a></div></div></div>`;
  return `<div class="intro">
    ${st==='reconsent'?`<div class="notice">${I('info',20)}<p>${t('consent.reconsent_note')}</p></div>`:''}
    ${st==='expired'?`<div class="notice">${I('clock',20)}<p>${t('error.session_expired')}</p></div>`:''}
    <span class="pill-tag">${mark(18)} ${t('chat.header.subtitle')}</span>

    <p class="sub">${t('page.tool.sub')}</p>
    <div class="greet">${mark(44)}<p class="greet-t">${greet.join('<br>')}</p></div>
    <ol class="steps">${steps.map((s,i)=>`<li><span class="num" aria-hidden="true">${i+1}</span><span>${s}</span></li>`).join('')}</ol>
    <section class="ccard" aria-labelledby="cc-t"><h2 id="cc-t">${t('consent.title')}</h2>${discList}${st==='declined'?declined:cbx}${acts}</section>
    <p class="not-this">${I('info',16)}<span>${t('page.tool.not_this')}</span></p>
    <div class="direct"><p>${t('page.tool.direct')}</p><div class="direct-ways"><a href="#" data-noop class="btn-sm">${I('phone',16)} <span dir="ltr">${PHONE}</span></a><a href="#" data-noop class="btn-sm">${I('wa',16)} וואטסאפ</a></div></div>
  </div>`;
}

/* ---- S13: minor on self, and a reporter who isn't the parent (D-02) ---- */
/* S13b copy (UX S13): success is announced through the announcer (focus stays on the button, the text stays visible); failure says so
   and reveals the details as selectable text. "הפרטים הועתקו" is never shown unless the clipboard write actually succeeded. */
function copyPayloadText(){ return tv('reporter.copy_payload').replace(/\{\{site_url\}\}/g,'hadas-toda.co.il'); }
function copyFailHtml(){
  // the exact reporter.copy_payload text, in a focusable read-only box that selects itself on focus; the phone and the URL are nowrap runs so they never split across lines
  const txt = esc(T['reporter.copy_payload']).replace(/\{\{hadas_phone\}\}/g,`<bdi dir="ltr" class="nb">${PHONE}</bdi>`).replace(/\{\{site_url\}\}/g,'<bdi dir="ltr" class="nb">hadas-toda.co.il</bdi>');
  return `<p class="copy-failed" id="cf-msg">${I('alert',18)}<span>${t('reporter.copy_failed')}</span></p><div class="payload" role="textbox" aria-readonly="true" aria-multiline="true" aria-labelledby="cf-msg" tabindex="0" onfocus="getSelection().selectAllChildren(this)">${txt}</div>`;
}
// the phone link is digits only on screen, so its accessible name starts with words (a11y.call_hadas, 2.4.4) and still contains the visible digits (2.5.3)
function callBtn(cls='btn-s',extra=''){ return `<a href="#" data-noop class="${cls}" ${extra}><span class="sr">${t('a11y.call_hadas')} </span><span dir="ltr">${I('phone',18)} ${PHONE}</span></a>`; }
function s13Scr(v){
  if (v==='minor_pre'){
    // D-13 branch A, stopped from the age tap, BEFORE any free text: the same card, plus 101 and the distress help lines
    // (the distress red flag has nothing to scan yet, so a minor stopped here would meet no other screen).
    // The Sahar link opens in a new tab, so it carries the hidden hint (outcome.4.external_hint). Focus goes to the card heading, no announcement.
    const sahar = `<a href="#" data-noop class="ext-link" target="_blank" rel="noopener">${vchip('sahar_url')} ${I('ext',16)}<span class="sr"> ${t('outcome.4.external_hint')}</span></a>`;
    const L = tl('minor.self.before_text',{call_name:true, sahar_url:sahar});
    return `<div class="rcard"><div class="rcard-h"><span class="rci">${I('info',24)}</span><h2 style="font-size:var(--t19);font-weight:500;color:var(--dark)" tabindex="-1" data-focus>השיחה הזו מיועדת לגיל 18 ומעלה</h2></div><p>${L[0]}</p><div class="helplines"><p>${L[1]}</p><ul><li>${I('phone',18)}<span>${L[2]}</span></li><li>${I('talk',18)}<span>${L[3]}</span></li></ul></div><p class="sec-emerg">${L[4]}</p><div class="c-acts c-acts-equal" style="margin-top:14px">${callBtn('btn-s')}<a href="#" data-noop class="btn-s" data-track-ignore="true">${I('phone',18)} ${t('redflag.cta.call_1201')}</a></div><p class="cf-small" style="margin-top:14px">${t('interim.deleted_note')}</p><div style="margin-top:10px">${btnS(t('nav.back_to_site'),'S0/contact')}</div></div>`;
  }
  const isMinor = v==='minor';
  const copied = v==='not_parent_copied', failed = v==='not_parent_failed';
  const body = isMinor ? t('minor.self',{call_name:true}) : t('reporter.not_parent',{call_name:true});
  const action = isMinor
    ? callBtn('btn-s','style="align-self:flex-start"')
    : `<div class="copy-row"><button type="button" class="btn-s" data-act="copy-contact"${copied||failed?' data-focus':''}>${I('copy',18)}${t('reporter.copy_contact')}</button>${copied?`<span class="copied-note">${I('check',16)} ${t('reporter.copied')}</span>`:''}</div>${failed?copyFailHtml():''}`;
  return `<div class="rcard"><div class="rcard-h"><span class="rci">${I('info',24)}</span><h2 style="font-size:var(--t19);font-weight:500;color:var(--dark)"${copied||failed?'':' tabindex="-1" data-focus'}>${isMinor?'השיחה הזו מיועדת לגיל 18 ומעלה':'פנייה על ילד או ילדה'}</h2></div><p>${body}</p>${action}<p class="cf-small" style="margin-top:14px">${t('interim.deleted_note')}</p><div style="margin-top:10px">${btnS(t('nav.back_to_site'),'S0/contact')}</div></div>`;
}

/* =====================================================================
   SCREENS & STATES
   mode: focus (tool fills the phone) · page (site page: header + floating buttons) · rf · mail · hpage
   ===================================================================== */
/* a wall of pasted text over 32KB in UTF-8 (about 16,000 Hebrew characters) — only for S3/toolong_block */
const LONGPASTE = (()=>{ const u='סיכום כל הבדיקות והביקורים מהשנים האחרונות, כפי שהודבק ממסמך אחר. '; let s=''; while(new TextEncoder().encode(s).length<33000) s+=u; return s; })();
