# הגדרות Netlify
[build]
  publish = "dist"
  command = "npm run build"

# הפעלת Netlify Identity
[context.production]
  environment = { NETLIFY_IDENTITY_ENABLED = "true" }

# הגדרות משתני סביבה לפרודקשן
[build.environment]
  # משתני סביבה יוגדרו בממשק Netlify

# הגדרות עבור שרת ה-proxy המקומי
[dev]
  framework = "vite"
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = true

# הפניה מ-HTTP ל-HTTPS (301 redirect)
[[redirects]]
  from = "http://hadas-toda.co.il/*"
  to = "https://hadas-toda.co.il/:splat"
  status = 301
  force = true

# הפניה מ-www ל-non-www (301 redirect)
[[redirects]]
  from = "https://www.hadas-toda.co.il/*"
  to = "https://hadas-toda.co.il/:splat"
  status = 301
  force = true

# הגדרות עבור ממשק הניהול
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# הגדרות עבור קבצי מדיה
[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

# מניעת הפניית דפי נחיתה ל-SPA
[[redirects]]
  from = "/landing/*"
  to = "/landing/:splat"
  status = 200

# הגדרת ברירת מחדל לכל הנתיבים האחרים
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# הגדרת Edge Functions עבור בדיקות A/B בדפי נחיתה
[[edge_functions]]
  path = "/landing/gimgum"
  function = "ab-gimgum"

[[edge_functions]]
  path = "/landing/gimgum/"
  function = "ab-gimgum"

[[edge_functions]]
  path = "/landing/kol"
  function = "ab-kol"

[[edge_functions]]
  path = "/landing/kol/"
  function = "ab-kol"

[[edge_functions]]
  path = "/landing/higuy"
  function = "ab-higuy"

[[edge_functions]]
  path = "/landing/higuy/"
  function = "ab-higuy"

[[edge_functions]]
  path = "/landing/peh"
  function = "ab-peh"

[[edge_functions]]
  path = "/landing/peh/"
  function = "ab-peh"

